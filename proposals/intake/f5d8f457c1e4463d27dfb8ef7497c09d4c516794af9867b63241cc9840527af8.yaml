          # Working editorial memo: Deep Memory

          **Assessment:** The report offers a useful route to a better illustrated explanation, but not the historical resolution it announces. Its strongest contribution is to put the proposed “handbag” resemblance back into complete scenes and local interpretations. The supplied Met spot check makes that comparison substantially more usable than it was in the current article.

          The report’s broader conclusions are not earned. It moves from plausible local explanations to demonstrated independent invention, from colonial mediation to wholesale invention, and from Witzel’s proposed reconstruction to established Paleolithic inheritance. Those are three separate inferential overreaches.

          This memo is a manual editorial experiment. I have neither browsed sources nor inspected image pixels. The supplied spot checks document another AI’s readings and visual inspection; they are useful working evidence, not human verification or ratification.

          ## 1. Most useful contribution—and its limits

          The useful advance is **an asymmetry between the two illustrated objects**:

          - Pillar 43 has three arched rectangular forms associated with animals, but their referents remain uncertain.
          - The Met describes accession **32.143.7** as an eagle-headed figure holding a bucket and a cone, with a protective or purifying interpretation. Its identification with *apkallu* is qualified and rests on comparison with figurines identified through ritual texts.

          That gives readers something concrete to learn. “A rectangle beneath an arch” is not yet a shared object identity. The Assyrian scene supplies handling, paired equipment and interpretive context that the Pillar 43 description does not supply.

          However, this is principally **a better explanation of known leads**, not a newly discovered comparison. The Met object, its plate and the institutional source were already in the case’s research path. The spot checks were also known-source checks performed before the report. They strengthen the material available to this editor; they do not validate the report’s other discoveries.

          Two limits must remain visible:

          1. **Different local meanings do not establish independent origins.** An inherited motif can change function or meaning. Conversely, merely allowing that possibility supplies no evidence that inheritance occurred.
          2. **Neither comparison has undergone the proposed discriminating test.** The report repeatedly describes a visual hypothesis as having “failed,” although it presents no defined comparison corpus, feature coding, baseline or historical transmission test.

          The report supports a substantially better **two-object article**, not its proposed sweeping essay resolving symbols, culture-bringers and flood traditions together.

          ## Proposed edition

          # An Outline Is Not Yet a Memory

          *Unratified working draft for the whole article. AI-prepared from the supplied ledger and documented AI source readings; not a published or human-reviewed conclusion.*

          At the top of one ancient pillar are three arched rectangles. In the hand of a much later Assyrian figure is a bucket. Put the outlines beside each other and a question follows: are we seeing a convention passed down through history, or a resemblance that becomes less informative when we restore the surrounding scene?

          **The comparison does not yet establish shared prehistoric inheritance.** But it does reveal why context matters—and why explaining an object locally is not the same as proving that its imagery has no older history.

          ## What the pillar gives us

          Oliver Dietrich’s [account of Pillar 43 at Göbekli Tepe](https://www.dainst.blog/the-tepe-telegrams/2016/10/14/of-animals-and-a-headless-man-gobekli-tepe-pillar-43/) describes [three rectangular forms topped with cupola-like arches, each paired with an animal]{claim=MEM-C002}. Calling them “handbags” would already go beyond that description: it would turn an outline into an identification.

          {plate:IMG-MEM-P01}

          *Pillar 43 in its excavation setting. The upper forms, bird carving and disc can be examined together; foreground stones conceal much of the lower face. This is not a complete view of every motif.*

          The pillar is not simply a display of three enigmatic shapes. Dietrich also describes [a human figure shown without a head and with an erect penis]{claim=MEM-C001}. Animals, geometric forms and human imagery belong to the same carved object. Any interpretation must account for that setting rather than isolate whichever detail resembles something elsewhere.

          One possibility discussed in the account is that the upper forms represent roofed enclosures. This gives the rectangles and arches an architectural reading rather than a portable one. But the account also identifies a difficulty: such buildings would be depicted unusually schematically. It offers a possibility, not a decipherment.

          The uncertainty is productive. It tells us which question comes first: not “Where did these bags travel?” but “What features would distinguish a bag from another kind of representation?”

          ## What changes at Nimrud

          The [Metropolitan Museum’s record for accession 32.143.7](https://www.metmuseum.org/art/collection/search/322614) describes a relief from the Northwest Palace at Nimrud, dated approximately 883–859 BCE. Here an eagle-headed, winged figure holds a bucket in its left hand and a cone in its right.

          {plate:IMG-MEM-P02}

          *The Assyrian relief preserves a complete pairing: figure, bucket and cone, with an inscription crossing the body. The museum discusses a protective or purifying function. The inscription’s presence should not be mistaken for a label identifying the implements.*

          This changes the comparison. The bucket is equipment held by a figure and paired with another implement. On Pillar 43, the source describes a repeated row of forms associated with animals. The question is no longer just whether two contours look alike. It is whether their attachment, repetition, associated figures and place within the scene follow the same convention.

          The museum’s interpretation also has a source history. Its qualified association of the figure with *apkallu*—supernatural sages—draws on resemblance to figurines identified through ritual texts. That is more informative than an isolated visual guess, but it is not equivalent to reading an explicit explanation of the bucket from the inscription across this relief.

          ## The strongest case for inheritance

          A serious inheritance argument need not insist that objects retained exactly the same meaning for thousands of years. Traditions can be adapted. A distinctive arrangement of animals, gestures and implements could survive while its explanation changed.

          That is the strongest reply to a simple dismissal based on different local functions. A known Assyrian use would not, by itself, exclude an earlier history.

          The reply has a limit of its own: **possible continuity is not demonstrated continuity**. A carried container needs some means of being carried, so a vessel-and-handle outline is an unsurprising shape. If the Göbekli Tepe forms are something else entirely, even the shared object category disappears. To favor transmission, the resemblance must contain details that independent invention or ordinary design constraints would not readily explain.

          Several histories remain possible: unrelated representations, regional borrowing, more distant inheritance, or a mixture in which different motifs travelled differently. Attributing any inheritance to a particular lost civilization would require additional evidence beyond the resemblance.

          ## What would make this a historical argument?

          The next comparison should start with full, authenticated views and a fixed list of features: how the arch joins the lower form, whether anything grasps it, what internal details recur, how forms are repeated, and how animals or other objects are positioned around them. Hidden or damaged features must remain unknown, not become convenient matches or absences.

          Then the proposed pair needs company: nearby traditions, documented examples of transmission, and unrelated objects that could produce equally close matches. Dated intermediate examples would matter especially if they preserved several distinctive relationships rather than the outline alone.

          Dietrich’s later [comment on possible connections to subsequent imagery](https://www.dainst.blog/the-tepe-telegrams/2016/10/14/of-animals-and-a-headless-man-gobekli-tepe-pillar-43/) points toward such a regional inquiry, while emphasizing missing links and possible changes in meaning. That is a lead to investigate, not a bridge already built.

          For now, the two objects give us a better question, not a recovered ancestral story. Their resemblance becomes historically interesting only when we can explain why these particular details should have travelled together.

          ## Proposed ledger changes

          These are proposals, not adopted records. New claims should receive IDs only through the normal record process.

          ### Priority 1 — Admit the bounded Met comparator

          **Current references:** `IMG-MEM-P02`; no corresponding canonical claim or source in the supplied ledger.

          **Exact source and reported locators:**  
          [Met object record, accession 32.143.7](https://www.metmuseum.org/art/collection/search/322614), **description paragraphs 1–7 and Object Information**, as reported in the supplied spot check. Image: existing plate file `relief-panel-met-dp375422.jpg`, sourced through [Commons: Relief panel MET DP375422.jpg](https://commons.wikimedia.org/wiki/File:Relief_panel_MET_DP375422.jpg).

          Create separate proposed claims for:

          - accession, place of origin and museum date;
          - bucket in the left hand;
          - cone in the right hand;
          - the museum’s protective/purifying interpretation;
          - the qualified *apkallu* identification and its comparative textual basis.

          Do not combine these with “no historical connection to Anatolia or Mesoamerica.”

          **Before adoption:** Preserve the actual museum passages and retrieval provenance; confirm paragraph boundaries, image-to-accession correspondence and the existing CC0 provenance. The supplied AI check supports these bounded proposals but does not provide this memo with direct access. Do not promote the source to human-verified.

          **Evidence treatment:** The object description supports local observational claims. The interpretation supports a claim about the museum’s reading and qualifies the cross-cultural analogy. It is not direct evidence against every possible history of transmission. Group all records for this relief under the same object dependency.

          ### Priority 2 — Enrich, rather than replace, the Pillar 43 record

          **Current IDs:** `SRC-MEM-F07B22F06CD5`, `MEM-C001`, `MEM-C002`, `MEM-E001`, `MEM-E002`.

          **Exact source and reported locators:**  
          [Dietrich, “Of animals and a headless man. Göbekli Tepe, Pillar 43”](https://www.dainst.blog/the-tepe-telegrams/2016/10/14/of-animals-and-a-headless-man-gobekli-tepe-pillar-43/):

          - existing retrieved-text anchors **2090–2123** and **2596–2660**;
          - **main article, uppermost-register discussion**, for the architectural possibility and its schematic-depiction objection;
          - **Oliver’s comment dated 17 October 2016**, for the Atakuman 2015 lead and cautions about missing links and changing meanings.

          Retain `MEM-C002`: the full-source readings support the animal association. The short extraction anchor is not a reason to remove it.

          Add a separate interpretive claim that **Dietrich discusses roofed enclosures as a possibility while identifying a difficulty**, not that the forms are probably buildings. Record source-stated uncertainty separately from the observable configuration.

          **Before adoption:** Capture full supporting passages and precise stable locators. Check the report’s attribution to **E. B. Banning (2011)** against the original publication before assigning Banning the detailed claims about roofs, social emblems or willow fencing. No exact Banning title, page or figure is supplied in the report.

          The source description should also be more informative than “a blog summary”: it is an excavation-project account by a relevant researcher, though not a substitute for primary object documentation.

          ### Priority 3 — Correct evidence direction and preserve assessment boundaries

          **Current IDs:** `MEM-E001`, `MEM-E002`; assessment of `MEM-C001` and `MEM-C002`.

          The evidence records currently use “context” even though their source statements directly support the local descriptive claims. Separate:

          - **supports** the bounded observation;
          - **context only / low diagnosticity** for broader inheritance.

          No confidence upgrade is warranted merely because the report repeats the existing descriptions. Keep the overall case **unresolved**, with an explicit explanation that the available comparison has become richer but has not established diagnostic similarity or transmission.

          Do not turn the preservation of inheritance as an alternative into affirmative support for it.

          ### Priority 4 — Record a relational comparison and a regional transmission lead

          Create a research crux: **Does this pair share distinctive scene relationships beyond the rectangle-and-arch outline?**

          The locators are those in priorities 1–2. Actual image coding remains prospective. The supplied AI visual notes establish only their stated observations; they are not a completed pairwise analysis.

          Preserve **Atakuman 2015** as an unresolved research opportunity through Dietrich’s **17 October 2016 comment**. Its full bibliographic identity, relevant pages, objects and chronology still need retrieval. This is potentially more useful for testing continuity than immediately adding a third distant silhouette.

          ### Priority 5 — Keep the wider discoveries as source-audit tasks, not findings

          The report’s citation annotations are present in this corrected handoff. The problem is **not missing citations**, but missing access distinctions and passage-level support for consequential claims.

          - **Assyrian terminology and ritual function:** Report sources **2–3, metmuseum.org**, are supplied as provider redirect URLs without exact passages. Resolve and archive their destinations. Find the particular ritual texts and editions supporting *banduddû* and *mullilu*. Verify separately whether the Standard Inscription says anything relevant to the implements.
          - **La Venta Monument 19:** Report sources **4, facebook.com; 5, cdlib.org; 6, dokumen.pub**. No page or figure locator is supplied. Establish the institutional object record, dating and the original argument identifying the held object as a copal container. Preserve “depicted bag,” “proposed contents” and “ritual interpretation” as separate propositions. Do not add a plate until object identity and reuse rights are checked.
          - **Culture-bringers:** The report names Sahagún, Motolinia, Mendieta, Cieza de León, Betanzos and Sarmiento de Gamboa but supplies no exact editions or passages for its decisive genealogy. Trace those witnesses before adopting claims about first attestation, borrowing, physical appearance or authorial intent.
