                  - deliberate political fabrication.

                  Its “pristine pre-Columbian” grouping also includes the *Florentine Codex*, a colonial-era witness. The Staff God–Viracocha identification and the La Venta serpent–Quetzalcoatl continuity require arguments, not assumed identities.

                  Decline biological claims about Andean beard growth as a decisive historical test. Likewise, “Caucasian features” is not an adequately defined coding category for stylized art. Absence of selected features from a limited surviving corpus would not “firmly ratify” deliberate Spanish invention.

                  ### Defer Witzel’s reconstruction as an explanation of this case

                  The report supplies neither the narrative dataset nor a test establishing that the claimed sequence tracks the stated migrations. It does not preserve substantive objections involving selection, cultural dependence, reconstruction or dating. “Scientifically grounded” and “precisely mirroring” cannot substitute for those arguments.

                  The reconstruction belongs in the research record as a potentially important affirmative inheritance hypothesis. It should not be used to announce that deep memory has been demonstrated.

                  ### Narrow the animal and architectural arguments

                  The ledger does not contain the report’s enclosure-wide animal distribution findings; those are scope leads, not recorded results. Uneven animal representation would not by itself strongly establish clan totems, nor would local symbolism exclude inherited conventions.

                  A structural finding against roofs on particular enclosures would constrain a literal architectural reading. It would not automatically eliminate every schematic-building interpretation or force a choice between “symbolic” and “astronomical.”

                  ### Correct the account of prior scope

                  No Sweatman claim appears in the supplied canonical ledger. An archaeoastronomical audit can be proposed separately, but not described as checking an existing ledger assertion.

                  The Indus/rongorongo lead **does** appear in the corrected prior-exploration register. Its mention is not an invention by the report. Deferring it is reasonable.

                  ## 5. Is the broader report more useful—and what is the fair next test?

                  **Yes, as editorial orientation; only partly, as research.** It points toward context that can make the comparison intelligible and identifies wider source-genealogy questions. That is more useful than repeatedly extracting another isolated motif from the same pillar.

                  But the supplied record does not demonstrate that the broad pass successfully pursued its new lines to primary evidence. Its confident resolution is worse than the narrow attempts’ bounded uncertainty. The best present improvement relies heavily on known sources and the separately supplied spot checks.

                  A fair next manual test should give broad research an opportunity to do what narrow extraction cannot:

                  1. **Commission one source-complete inquiry into a possible regional bridge**, beginning with Dietrich’s Atakuman reference. Require exact objects, dates, passages, full views, the affirmative argument and its strongest objection.
                  2. **Complete authentication of the existing two-object comparison** without requiring an exact doorway assignment unless that placement affects the inference.
                  3. **Freeze comparison features before expanding the image search.** Include regional examples, appropriate controls and misses. Do not treat two selected plates as a rarity test.
                  4. **Independently check both a consequential positive claim and a consequential adverse claim**, using original sources and page/image locators—not just agreement over the report’s summaries.

                  Judge the result by whether it changes a historical inference, corrects an important premise or supplies a discriminating test with traceable evidence. An unchanged verdict can pass. Another sweeping resolution assembled from plausible summaries should not.
