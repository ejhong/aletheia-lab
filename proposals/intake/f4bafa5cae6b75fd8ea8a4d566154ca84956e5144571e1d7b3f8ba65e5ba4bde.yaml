ir local credibility from their low diagnosticity for shared inheritance. IMG-MEM-P01 and the MEM-C001 reference are retained. IMG-MEM-P02 is omitted because no ledger claim or evidence record establishes the proposed Assyrian comparison; its manifest description alone should not carry that historical argument. The incumbent’s Met link and interpretive assertions are likewise omitted because that source is absent from the supplied ledger. The generated cover is not used as evidence. Proposed tests are explicitly prospective, and the case receives an unresolved assessment rather than an implied negative finding.","source":null},{"id":"e70a2c35c18573660195ef72ddde7358c84ea3752a7ecb89079da7400aee37e2","date":"2026-09-06","stage":"edition-cycle","outcome":"contested","reason":"Comparison contested; the incumbent remains in place. See the complete draft and seat records.","source":null},{"id":"aa04f8dcdf97f00834030d1ec42699819bc362fff7e7ff02d95237848dcd3137","date":"2026-09-06","stage":"edition-cycle","outcome":"proposed","reason":"Independent comparison advances the recomposition; publication still requires the normal gate.","source":null},{"id":"2bc584a2bea82317dc1c68ba7688eab3f05d9c53cd80e5a3d24d20cdf16ca39e","date":"2026-09-07","stage":"source-request","outcome":"queued","reason":"Supplied URL queued for a bounded reading and a separate source check.","source":{"url":"https://www.metmuseum.org/art/collection/search/322614"},"requestedReading":"{\"question\":\"Do securely documented views and contexts of Göbekli Tepe Pillar 43 and the proposed Metropolitan Museum comparator, accession 32.143.7, support a resemblance more specific than a rectangular form beneath an arch?\",\"inclusion\":\"Admit observations only from institutional object records, excavation publications or original research explicitly identifying one of the two objects. Images must be traceable to that object, with credit or provenance and a documented date or date range; distinguish object dating from