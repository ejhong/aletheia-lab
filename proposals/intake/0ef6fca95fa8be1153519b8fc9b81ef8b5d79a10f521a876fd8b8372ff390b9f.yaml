        article: |-
          When does a resemblance become a memory? An arch above a rectangle, a bird-headed figure with an implement, a teacher who departs across the sea: each could be the beginning of a historical connection. But resemblance and inheritance are different discoveries. The first identifies a pattern; the second explains how it came to exist.

          The question behind *Deep Memory* is whether shared symbols and myths preserve a common prehistoric inheritance. **The present evidence does not resolve that question.** It does, however, offer several concrete ways into it: an archaeological comparison, a proposed regional history of imagery, a reported correspondence between teaching figures, and exploratory tests that expose difficulties in measuring visual and narrative similarity. These strands need not ultimately have the same explanation.

          ## Two objects, not yet one tradition

          At Göbekli Tepe, [Oliver Dietrich’s excavation-project account](https://www.dainst.blog/the-tepe-telegrams/2016/10/14/of-animals-and-a-headless-man-gobekli-tepe-pillar-43/) describes [three rectangular forms topped with cupola-like arches, each paired with an animal, at the top of Pillar 43]{claim=MEM-C002}. That wording matters. It describes the forms without deciding whether the arches are handles or what the rectangles represent. The architectural interpretation discussed in the account remains tentative.

          {plate:IMG-MEM-P01}

          The plate’s supplied description notes that foreground stones obscure the lower part of the pillar. It therefore cannot independently check another detail in Dietrich’s account: [a human figure shown without a head and with an erect penis]{claim=MEM-C001}. That figure belongs in an eventual reading of the whole scene, but its presence alone does not identify a story or establish a connection elsewhere. Both descriptions concern one object and come through one source.

          The Assyrian comparator has a more definite local identification. The [Metropolitan Museum of Art’s record for relief 32.143.7](https://www.metmuseum.org/art/collection/search/322614) describes [a winged, eagle-headed figure carrying a bucket and a cone-shaped implement]{claim=MEM-C003}. Its description places the bucket in the left hand and the cone in the right.

          {plate:IMG-MEM-P02}

          [The Met interprets the paired implements as serving protective or purifying purposes]{claim=MEM-C004}. This is a qualified museum interpretation, not an explanation explicitly written beside the implements in the relief’s inscription.

          Here the comparison becomes more interesting than a shared outline—and less straightforward. One source describes three repeated forms associated with animals; the other identifies a carried vessel paired with another implement. Calling both “handbags” would decide their identity before testing it. Yet explaining the Assyrian equipment locally would not, by itself, prove that its imagery had no older history. **Function and ancestry are separate questions.**

          A useful comparison would preserve the relationships: repetition, attachment, internal detail, gestures and neighboring figures. It would ask not only what matches, but whether those matches are unusual among appropriately chosen objects. The current records establish the comparison’s starting materials, not a measured resemblance or a transmission chain.

          ## The missing middle may be regional

          A common prehistoric source is not the only historical alternative to independent invention. A regional sequence of borrowing and transformation could explain a particular motif without explaining every distant resemblance.

          [Çiğdem Atakuman proposes that Later Neolithic stamp imagery developed through transformations of earlier regional imagery]{claim=MEM-C005}. Her paper, [*From Monuments to Miniatures*](https://www.researchgate.net/publication/283782270_From_Monuments_to_Miniatures_Emergence_of_Stamps_and_Related_Image-bearing_Objects_during_the_Neolithic), assembles named comparanda in Figure 18 and discusses the proposed transformations on pages 778–779.

          This supplies something a gallery of distant lookalikes cannot: a concrete route for investigating continuity. But the ledger supports the attribution of Atakuman’s model, not a finding that every proposed link is correct. The underlying object histories, dates and comparison baselines still require an audit. Nor does the model establish descent from Pillar 43’s upper forms to the Nimrud bucket.

          The strongest inheritance argument worth pursuing is therefore not “the shapes look alike.” It is that a distinctive set of relationships may survive through changes in medium, scale or local use. Finding dated intermediate examples would strengthen that argument. Finding equally good unrelated comparisons, mistaken identifications or incompatible chronological sequences would weaken the proposed route. Neither outcome would settle all symbolic traditions.

          ## Can resemblance be measured?

          The Pillar 43–moai comparison introduces a different problem: the reliability of the instrument used to judge similarity.

          [Birdmen’s image-pilot account reports substantial disagreement between its Opus and GPT-5.5 judges on the pair’s direct-score assessment]{claim=MEM-C007}. The [page](https://ejhong.github.io/birdmen/pictures.html) describes the pair as unusual under Opus’s direct scoring but ordinary under GPT-5.5’s search comparisons. It also reports a failed feature-coding pilot, an initially positive lineup result explained by object type, and a negative result when the lineup matched object types.

          The positive finding should not disappear behind the negative ones. But neither should the favorable score be treated as archaeological confirmation. The account acknowledges prompts mixing resemblance with historical interpretation, repeated photographs of objects, uneven image presentation and incomplete runs. Raw judgments and calculations have not been reproduced in this ledger, and the models have not been shown to track human resemblance judgments.

          The immediate lesson concerns measurement: changing the judge or comparison conditions can change the answer. A failed instrument does not show that no distinctive resemblance exists. A favorable instrument reading does not show that a tradition travelled. Before using such scores historically, a new test would need authenticated images, equivalent presentation, object-type-matched controls and a clear resemblance-only task.

          ## A teacher leaves by sea

          Stories offer a potentially richer comparison because actions can occur in an order. The relevant question is not merely whether two figures bring knowledge, but what they teach, what happens next and which details belong to each recorded account.

          [The Birdmen culture-bringer audit reports instruction followed by an extraordinary sea departure as a correspondence between its Sahagún and Sarmiento accounts]{claim=MEM-C006}. In the captured [audit excerpt](https://ejhong.github.io/birdmen/civilisers.html), Quetzalcoatl’s account is associated with crafts and departure on a serpent raft; Viracocha’s with instruction followed by walking over the sea with two servants. The audit preserves differences in teaching, companions and travel rather than presenting identical biographies.

          This is a substantive affirmative lead. A teaching–departure sequence is more specific than generic civilizing activity or physical appearance. Its strongest unanswered question is whether the correspondence survives checking the actual witnesses and remains distinctive against other teaching figures.

          The evidential limit is equally concrete: only a short audit excerpt was captured, and the underlying Sahagún and Sarmiento passages were not successfully read in this reconciliation. A selected pair gives no estimate of rarity. The audit also comes from the project that supplied this case’s founding motivation, not an independent historical investigation.

          Common descent, borrowing, independent narrative construction and resemblance introduced by translation or later retelling remain alternatives. Colonial recording calls for examining mediation; it does not itself establish colonial invention. Equally, preserving a genuine correspondence would not identify a lost source civilization. The next step is to compare separate witnesses, not assemble a single composite culture-bringer from their most similar episodes.

          ## Do the motifs travel together?

          A broader inheritance proposal might predict a recurring package rather than isolated similarities. One exploratory analysis asks whether bird-person, cosmic-serpent and world-centre motifs form such a package.

          [Birdmen’s catalogue experiment reports that this bundle does not stand out against its documentation-preserving comparisons]{claim=MEM-C008}. According to the [account](https://ejhong.github.io/birdmen/myths.html), an apparent excess over simple independence disappears when the comparisons preserve features of documentation. In plain terms, the result changes when the analysis accounts for how much material the catalogue records.

          If reproduced, this would count against an unusually co-occurring package of those broad categories in that sample. It is not a test of the exact carvings, “navel” place-name etymologies or a distinctive ordered story. The matrix, class membership and outputs were not checked here. Keyword definitions and mappings between named cultures and catalogue traditions may affect the result; preserving documentation totals does not automatically account for related traditions or contact between them. A sparse catalogue entry is not evidence that a culture lacked a motif.

          This is useful negative evidence with a narrow reach—not a demonstration that all such motifs arose independently. Geographic dispersion alone would not decide that either: an inherited tradition could also become widespread.

          ## What would a deep narrative history have to explain?

          Reconstructing inherited narrative packages faces another test: how consistently does the model treat missing pieces?

          In his [review of Michael Witzel’s *The Origins of the World’s Mythologies*](https://scholarworks.iu.edu/journals/index.php/jfrr/article/view/38998), [Tok Thompson argues that unequal criteria are applied to missing narrative elements in the Laurasian and Gondwana classifications]{claim=MEM-C010}. He says missing elements in Dene and Inuit/Yupiq traditions are explained as unrecorded, forgotten or untold, while comparable incompleteness helps place San traditions in the other category.

          That is a specific methodological objection, not a verdict established by this edition. The book, underlying narrative corpora and Witzel’s substantive reply have not been inspected here. The strongest inheritance response remains possible: traditions can lose elements, and records can be incomplete. But a discriminating model would need independently justified, symmetrical rules for allowing those losses—not an explanation invented separately for every awkward case.

          Floods require particular care. [Thompson’s review says Witzel’s book revises his earlier treatment of flood myths as specifically Laurasian]{claim=MEM-C011}, instead treating them as universal—a characterization Thompson also disputes. This does not establish the distribution of flood stories. It does warn against treating a flood-based division as settled. A generic flood and a particular ordered punitive-flood sequence are different propositions; checking the book is necessary to determine how that distinction bears on the disagreement.

          Whether a story preserves a local disaster, whether stories share ancestry and whether they remember one common event are also separate questions. The present ledger does not resolve their chronology.

          ## What would change the answer?

          The most informative next work would connect specificity to history:

          - **For images:** freeze descriptive features and fair comparison sets, then audit complete objects and dated intermediates—especially the regional sequence proposed by Atakuman.
          - **For teaching traditions:** verify the separate passages and compare instruction, companions and departure without merging accounts; include other teaching figures as controls.
          - **For myth packages:** reproduce the catalogue result and test sensitivity to definitions and cultural dependence; assess ordered narratives separately under consistent rules for missing material.

          Other parts of the question remain open. Animal silhouettes and hand postures need securely identified, contextualized comparanda. Sacred-centre names need linguistic meanings and early attestations, not a substitute category in a mythology catalogue. Specific bird-human and feathered-serpent configurations need more precise treatment than broad motif labels. None has earned a shared-origin verdict here.

          The best current account is therefore plural and unfinished. Local observations are credible; regional inheritance is a concrete research possibility; a teaching–departure correspondence deserves verification; reported negative and unstable results constrain some proposed tests. These do not add up to either a recovered global tradition or a universal explanation by convergence. A lost-civilization account would add further claims about the source’s identity, date and capabilities, none established by the present comparisons.

          The possibility worth keeping is that something more specific than an outline—a relationship, an action, a sequence—may have survived. The task is to find out whether its history survives scrutiny too.

          *This is an AI-generated draft assessment under Aletheia’s constitution, not a ratified judgment or a reviewed human conclusion.*
