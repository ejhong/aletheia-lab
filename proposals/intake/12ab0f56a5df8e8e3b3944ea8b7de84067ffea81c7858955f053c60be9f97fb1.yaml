        2.  **The "Roofed Enclosure" Architectural Test**: Expand the research on E.B. Banning’s hypothesis regarding Göbekli Tepe. Investigate subsequent excavation reports (post-2011) to see if geophysical surveys or structural engineering models support or refute the presence of heavy roofs on Enclosures A-D.
            *   *Discriminator*: If Göbekli Tepe’s enclosures could not physically support roofs, Banning's interpretation of the Pillar 43 "handbags" as roofed buildings fails, forcing a return to symbolic or astronomical interpretations.
        3.  **Archaeoastronomy Review**: The ledger mentions Martin Sweatman's astronomical interpretation of Pillar 43 as a memorial to a comet strike. This claim requires an independent, rigorous audit. 
            *   *Check Needed*: Extract Sweatman’s exact peer-reviewed claims and cross-reference them against mainstream archaeoastronomical critiques. Does the positioning of the animals actually match the constellations of 10,950 BCE without selectively altering the star map? 

