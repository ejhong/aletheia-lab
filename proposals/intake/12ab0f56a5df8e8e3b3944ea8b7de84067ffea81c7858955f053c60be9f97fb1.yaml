is, a specific local iconographic observation that is relevant context but does not establish any broader prehistoric inheritance by itself."}]},{"id":"7403ca928d40b333f1a817d170cd0ecdf0c8f51788b938a01289e8cca1272c6d","date":"2026-09-06","stage":"edition-proposal","outcome":"proposed","reason":"First saved edition of Deep Memory, preserving the opening question, its first sourced observation, and the two photographic plates.","source":null},{"id":"2ad7d002427ff51c33f96454e6307f29b688bec6716cf571e92ac0a3cec08548","date":"2026-09-06","stage":"source-request","outcome":"queued","reason":"Supplied URL queued for a bounded reading and a separate source check.","source":{"url":"https://ejhong.github.io/birdmen/myths.html"},"requestedReading":"{\"meta\":{\"case\":\"deep-memory\",\"type\":\"links\"},\"body\":\"\\nAI-prepared intake on Eugene's direction, 2026-09-06.\\n\\nhttps://ejhong.github.io/birdmen/myths.html\\n\\nInspect the catalogue experiment on birds, serpents and sacred centres.\\nWhat does its particular sampling and coding show about motifs occurring\\ntogether, and what does it leave unresolved? Distinguish broad narrative\\ncategories from specific images, compositions and place-name etymologies.\\nPreserve uneven documentation and cultural dependence when considering\\nbaselines. Trace any proposed quantitative claim to the saved data and\\nmethod before admitting it to the case. Findings apply to this sample and\\noperational definition, with broader historical implications assessed separately.\\n\\nAI execution provenance: model `GPT-6 (OpenAI Codex)`; date `2026-09-06`;\\nrunId `codex-budget-intake-2026-09-06` (locally assigned session label);\\npromptVersion `none` (interactive founder-directed work, no versioned\\npipeline prompt). Eugene supplied the direction; the wording is AI-written.\\n\"}"},{"id":"3b0dbde7610e1ae6b8cb624985f21c3d4831b7279d854344c05e2bd664b00503","date":"2026-09-06","stage":"source-request","outcome":"queued","reason":"Supplied URL queued for a bounded reading and a separate source check.","source":{"url":"https://ejhong.github.io/birdmen/"},"requestedReading":"{\"meta\":{\"case\":\"deep-memory\",\"type\":\"links\"},\"body\":\"\\nAI-prepared intake on Eugene's direction, 2026-09-06. The public Birdmen\\nproject is a source of research leads for this case.\\n\\nEditorial direction from this session: build an illustrated account with\\nrelevant plates beside the passages they explain. For each usable image lead,\\nrecord the exact object, original image source, rights/credit, and the visible\\nfeature the caption can support. Preserve differences and counterexamples in\\ncomparisons. Feed verified image records into the existing plate manifest and\\nedition markers; keep the article's default view calm while captions reveal\\nthe detail. This is a research and illustration lead, not a claim that all\\nBirdmen images are already cleared or identified.\\n\\nhttps://ejhong.github.io/birdmen/\\n\\nStart with the relationships between visible features: the bird, bent limb\\nand disc on Pillar 43; handled forms; pig and boar silhouettes; and crouching\\nanimals. Establish complete object identity, date, context and image fidelity\\nbefore interpreting a resemblance. Preserve unresolved identifications and\\nthe differences between objects. Follow the page's excavation and museum\\nreferences for consequential observations. A shared outline alone does not\\nestablish shared function, descent or a lost civilisation.\\n\\nAI execution provenance: model `GPT-6 (OpenAI Codex)`; date `2026-09-06`;\\nrunId `codex-budget-intake-2026-09-06` (locally assigned session label);\\npromptVersion `none` (interactive founder-directed work, no versioned\\npipeline prompt). Eugene supplied the direction; the wording is AI-written.\\n\"}"},{"id":"775aa030641d14c7436b98be5fabf5cfb0db1edfee98034458b0805167fcce92","date":"2026-09-06","stage":"source-request","outcome":"queued","reason":"Supplied URL queued for a bounded reading and a separate source check.","source":{"url":"https://ejhong.github.io/birdmen/civilisers.html"},"requestedReading":"{\"meta\":{\"case\":\"deep-memory\",\"type\":\"links\"},\"body\":\"\\nAI-prepared intake on Eugene's direction, 2026-09-06.\\n\\nhttps://ejhong.github.io/birdmen/civilisers.html\\n\\nUse the source audit to investigate the proposed resemblance among culture\\nbringers such as Oannes, Viracocha, Quetzalcoatl and Bochica. Follow the\\nunderlying editions and passages rather than combining modern biographies.\\nSeparate arrival, specific teachings, catastrophe sequence and departure;\\nrecord which details each witness actually supplies. Preserve translation,\\nrecording and transmission dependencies. A late recording date calls for a\\nmediation inquiry; it does not by itself prove a late invention. The earlier\\nlineup experiment and this source audit answer different questions.\\n\\nAI execution provenance: model `GPT-6 (OpenAI Codex)`; date `2026-09-06`;\\nrunId `codex-budget-intake-2026-09-06` (locally assigned session label);\\npromptVersion `none` (interactive founder-directed work, no versioned\\npipeline prompt). Eugene supplied the direction; the wording is AI-written.\\n\"}"},{"id":"8c06a5aadcdbd2ee6407ed8ac6cf49601c6910ce2e58c58319cf49cb2049fc45","date":"2026-09-06","stage":"source-request","outcome":"queued","reason":"Supplied URL queued for a bounded reading and a separate source check.","source":{"url":"https://ejhong.github.io/birdmen/pictures.html"},"requestedReading":"{\"meta\":{\"case\":\"deep-memory\",\"type\":\"links\"},\"body\":\"\\nAI-prepared intake on Eugene's direction, 2026-09-06.\\n\\nhttps://ejhong.github.io/birdmen/pictures.html\\n\\nRead the Pillar 43 and moai image pilots as experiments in measuring\\nresemblance. Identify what the saved methods and results actually establish\\nabout altered illustrations, object matching, repeated objects and agreement\\nbetween judges. Keep results from separate pilots separate. A