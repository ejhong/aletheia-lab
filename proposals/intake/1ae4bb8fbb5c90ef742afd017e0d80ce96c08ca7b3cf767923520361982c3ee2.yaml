            id: MEM-R004
            title: Validate resemblance measurement before interpreting the Pillar 43–moai comparison
            summary: Audit saved pilot outputs and authenticate the target images before any rerun. Predeclare a
              resemblance-only task, separate from historical interpretation. Use comparable image
              sizes and identical background treatment for every candidate; distinguish objects from
              photographs and exclude uncertain same-object pairs from independent controls. Include
              object-type-matched comparisons and independently justified transmission controls.
              Assess coder agreement and, if a properly documented human-comparison study becomes
              feasible, test whether model rankings track human judgments. No experiment or
              recruitment has occurred.
            claimIds:
