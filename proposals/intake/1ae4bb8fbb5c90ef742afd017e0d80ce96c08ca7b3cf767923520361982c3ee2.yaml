            track: either
            effortTier: desk
            informationGain: Stable rankings across validated instruments and appropriate controls would make
              resemblance measurable. Persistent disagreement or failure to recover controls would
              make the instrument uninformative, not refute inheritance. A strong visual match would
              still require dating and connecting historical evidence.
