    reason: "The available captures warrant a bounded update about prior investigations and a published
      methodological criticism, not the report's proposed resolution of prehistoric inheritance.
      Four Birdmen captures recover useful affirmative comparisons, reported negative results and
      important methodological corrections; they do not independently verify the underlying objects,
      texts, datasets or experiments. Thompson's review supplies a substantive criticism of Witzel
      and also challenges the report's account of Witzel's treatment of flood myths, but Witzel's
      own text and replies remain unread in this pass. Existing MEM-C001–C005, MEM-E001–E005 and
      their provenance should remain unchanged: failed retrievals do not undo earlier readings. The
      proposed catalog records distinguish what these sources report from archaeological or
      historical conclusions. Prospective research retains the strongest inheritance
      argument—distinctive relationships and ordered narrative packages—while testing selection
      effects, measurement validity, mediation and alternative histories. The broader animal,
      hand-posture, sacred-centre, serpent and contact strands remain open rather than being
      replaced by the narrowly documented bucket comparison. All changes are unratified candidates."
