        - title: Bank the flood pilot's correction to its inheritance prediction
          outcome: failed
          reason: "Source check did not support this bundle: SRC-MEM-BIRDMEN-FLOODS: The supplied URL resolves
            to a webpage that contains a narrative, a description of the coding protocol and an
            explicit limitations section (coding provenance, reliance on Mark Isaak’s summaries,
            single-coder/model notes). The source-record verification note (“narrative, coding
            description and limitations were read…”) accurately reflects the page content. The page
            itself keeps observed results (distribution of coded summary features) distinct from
            higher historical inferences and warns about dependence on compiler summaries and
            post-contact recording. The source record supplied no precise page/paragraph locator, so
            no locator-level check was possible. MEM-C009: The page’s section on “what the pilot can
            distinguish” explicitly records that an initial expectation (that an ancient common
            source would produce little regional structure) is not treated as a necessary
            consequence of common ancestry, noting that inherited stories can diversify. The
            extraction preserves the source’s context and its methodological correction rather than
            turning that correction into a claim of inheritance. The claim’s locator (Section 02)
            matches the page structure. MEM-E009: The evidence statement accurately paraphrases the
            webpage: it records that the pilot author(s) note diversification of inherited
            narratives, that regional clustering does not rule out inheritance, and that
            concentrations of biblical-like details invite a borrowing hypothesis whose
            direction/timing require source-history work. The proposed limits (use of Isaak
            summaries, single-model coding, publication vs collection dates, and the need to trace
            source history) are all present on the page (sections 02, 06 and 09), so the evidence
            extraction is supported while preserving the page’s caveats."
