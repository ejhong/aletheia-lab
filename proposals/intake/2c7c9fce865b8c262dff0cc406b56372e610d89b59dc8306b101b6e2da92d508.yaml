      coverage:
        - strand: Bounded Pillar 43 and Nimrud descriptions
          state: covered
          reason: MEM-C001–C004 and their evidence records already supply a limited observational foundation
            and an attributed museum interpretation. Their provenance and qualifications should be
            preserved. Covered here means those bounded records exist, not that this commission
            independently verified them or that transmission has been tested.
        - strand: Handled forms, local functions and historical inheritance
          state: investigate
          reason: The existing pair and MEM-R001 provide a starting point, but the report's
            functional-independence conclusion exceeds them. Architectural attribution, Assyrian
            textual support, Halil Rud objects and La Venta's complete context remain consequential
            checks.
        - strand: Regional continuity from monuments to portable imagery
          state: investigate
          reason: MEM-C005 describes Atakuman's model; MEM-R002 identifies its uncompleted object-level audit.
            This is substantive affirmative prior work, not a demonstrated lineage or a reason to
            omit the regional alternative.
        - strand: Bird-person imagery, bird-and-disc relationships and Rapa Nui
          state: investigate
          reason: The founding comparison requires authenticated complete objects and separate treatment of
            the image pilots. The report's bucket discussion does not answer this strand, and the
            unidentified supplied bird image remains an authentication problem.
        - strand: Boars, Lingjiatan and reptile-versus-felid comparisons
          state: open
          reason: The report discusses enclosure distributions but does not authenticate the cross-cultural
            animal pairs. The founding captions and montage are leads only; species, scale, object
            identity, chronology and comparison baselines remain unresolved.
        - strand: Culture-bringers and teaching narratives
          state: investigate
          reason: Recorded prior work identifies source-specific teaching and water-related correspondences
            alongside different protagonists and event orders. The primary-text readings and audit
            should recover that wider argument rather than equating it with claims of European
            appearance.
        - strand: White-god narratives, colonial mediation and Indigenous testimony
          state: investigate
          reason: This is a distinct criticism within the culture-bringer strand. The report's blanket
            interpolation claim, attribution to Townsend across regions, and proposed
            pre-contact/colonial visual contrast require separate checks. Colonial mediation and
            preservation of older Indigenous material are not mutually exclusive.
        - strand: Flood narrative transmission and memories of environmental events
          state: investigate
          reason: The flood pilot and Berossus offer concrete starting points. Shared narrative descent, local
            disaster memory and a single worldwide catastrophe require different evidence; regional
            results alone do not determine the age or origin of a story.
        - strand: Paleolithic myth reconstruction and oral longevity
          state: investigate
          reason: Witzel's model and the identified critique need paired readings. Geographically calibrated
            claims of millennial environmental memory are a separate promising lead, not proof of
            intact narrative packages surviving tens of thousands of years.
        - strand: Sacred centres and navel place names
          state: open
          reason: The catalogue experiment can inform broad motif prevalence but cannot establish the
            meanings, earliest attestations or ancient use of the Greek, Quechua, Rapanui and
            Turkish expressions. The report leaves this founding strand unanswered.
        - strand: Hand postures and stone-body conventions
          state: open
          reason: The Hoa Hakananai'a reading may establish one comparator, but the regional Anatolian,
            Polynesian and Andean objects still need complete views. Material constraints are a
            hypothesis to evaluate, not a demonstrated explanation of every gesture.
        - strand: Serpents and specifically feathered serpents
          state: investigate
          reason: The catalogue audit addresses only broad narrative classes. La Venta, Teotihuacan and Halil
            Rud require object-specific comparison, and a feathered serpent cannot automatically be
            identified as the later named Quetzalcoatl.
        - strand: Lost-source accounts, known contact and mixed histories
          state: open
          reason: The report does not reconstruct the strongest proponents' arguments or test a defined
            lost-source hypothesis. Direct proponent readings and independent contact evidence are
            needed; neither a local function nor a demonstrated contact episode establishes or
            excludes the proposed global inheritance.
        - strand: Indus–rongorongo companion investigation
          state: open
          reason: The founding page identifies a separate prior investigation, but its linked results have not
            been verified here. Its methodological relevance can be inspected without importing a
            script-descent verdict into this case.
