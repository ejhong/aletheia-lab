          supplied private material, images, or verbatim source passages are reproduced. The brief
          cites public web publications; linked material retains its own rights.\",\"text\":\"# Deep
          Memory\\n\\n**Working question:** Do shared symbols and myths preserve a common
          prehistoric\\ninheritance?\\n\\nAI-authored scoping proposal, Codex (GPT-6), 2026-09-06
          UTC / 2026-09-05 Pacific.\\nThis is an implementation proposal based on the public birdmen
          site and\\nthe excavation-project publications linked below. It is not a
          research\\nfinding or a statement attributed to the founder.\\n\\n## One case, several
          distinguishable questions\\n\\nInvestigate the proposed shared inheritance behind
          recurring images and\\nstories, beginning with comparisons involving Göbekli Tepe. The
          title names\\na possibility to examine. It does not assume that the images share a
          meaning,\\nthat Göbekli Tepe was their origin, or that common ancestry would require
          an\\nadvanced lost civilization.\\n\\nKeep the inferential steps visible: an authenticated
          object or text; a\\nspecific resemblance; resemblance that stands out against fair
          comparisons;\\na plausible transmission or inheritance history; and, only with
          additional\\nevidence, a particular earlier culture proposed as its source. A result on
          one\\nstep does not settle the next. Similarity can help motivate a
          transmission\\nhypothesis; chronology, context, and independent connecting evidence
          must\\nhelp distinguish it from alternatives.\\n\\nConsider independent invention, common
          constraints and experiences, known\\nregional transmission, and a deeper shared tradition.
          The lost-civilization\\naccount belongs among the stronger hypotheses to test. Mixed
          histories remain\\npossible: different motifs need not have the same explanation. Modern
          copying,\\nmisidentification, and edited imagery are also possible causes of an
          apparent\\nmatch and must be checked before interpreting it historically.\\n\\n## Scope
          and case improvement\\n\\n| Strand | Starting leads | First task |\\n| --- | --- | ---
          |\\n| Images | Pillar 43 and proposed Rapa Nui parallels; bird and bird-human figures; the
          bird-and-disc comparison; handled shapes described as handbags | Identify the actual
          objects and complete scenes, then separate visible form from inferred identity or meaning.
          |\\n| Animal forms | Boar imagery and the animal forms variously interpreted as reptiles
          or felids in the excavation project's Enclosure C and Enclosure B discussions, linked
          below | Recover object records and comparable views, then identify possible cross-cultural
          comparisons. Treat species identification itself as a question. |\\n| Culture-bringer
          traditions | Proposed correspondences among Oannes, Viracocha, Quetzalcoatl, and other
          teaching figures | Locate early attestations and distinguish episodes, translations, later
          retellings, and possible contact histories. |\\n| Flood traditions | Proposed shared
          narrative details and memories of catastrophe | Trace individual versions and their
          dependencies before comparing them; distinguish shared experience from a shared story.
          |\\n\\nThe founding question includes all of these strands, as well as the
          sacred-centre,\\nhand-posture and serpent comparisons in the complete Birdmen page saved
          beside\\nthis brief. Read that page, including its five study summaries and
          limitations,\\nbefore deciding what the current case needs. Its linked work is available
          for\\ndeeper inspection; a link does not mean that work has already been
          reviewed.\\n\\nThe founder clarified on 2026-09-07 that an incomplete first account is
          an\\nextreme test of the ordinary update process. The current handful of records\\nmust
          not dictate the scope. Investigate the whole question sufficiently to\\norient the reader,
          then deepen the strands most likely to improve understanding.\\nPreserve useful findings,
          objections and unresolved leads beneath a selective\\nedition. Keep the separate source
          histories of images and stories visible;\\ndo not count results twice when they depend on
          the same source or proposed\\nhistory. This supersedes the earlier AI proposal to begin
          with only two visual\\nobservations and postpone the rest.\\n\\nThe initial case concerns
          cultural transmission and memory. A geological\\ncatastrophe mechanism belongs in the
          existing YDIH case; construction methods\\nbelong in the megalithic-casting case. Refer to
          those assessments where a\\nspecific dependency is needed. This case does not attempt a
          verdict on all\\nof Hancock's work.\\n\\nFor the first bounded visual test, choose the
          comparison corpus and observable\\nfeatures before evaluating outcomes. Include regional
          context, documented\\ntransmission controls where defensible, and unrelated comparisons
          matched for\\nobject type and image quality. Distinguish different objects from
          multiple\\nphotographs of one object. Compare the selected match with the best matches
          a\\nsearch of that scope would ordinarily find. Record selection effects and\\nmissing
          coverage; do not turn a convenient image collection into a claim to\\nhave sampled all
          world art. If the measurement cannot recover its controls\\nor its coders cannot agree,
          report the test as uninformative.\\n\\n## Relationship to the birdmen project\\n\\nThe
          [Deep Memory site](https://ejhong.github.io/birdmen/) and
          its\\n[repository](https://github.com/ejhong/birdmen) supply the motivation and\\nearlier
          exploratory methods. Their image, myth, culture-hero, and flood\\npilots are prior work to
          inspect, including their revisions and limitations.\\nThey are not independently verified
          findings in this ledger. This recorded\\nbrief uses the public project as its discovery
          reference. It contains no\\nspecific comparisons sourced only to supplied local images or
          conversations.\\n\\nAn initial primary-source route is the Göbekli Tepe research
          project's\\n[Pillar 43
          discussion](https://www.dainst.blog/the-tepe-telegrams/2016/10/14/of-animals-and-a-headle\
          ss-man-gobekli-tepe-pillar-43/).\\nUse it to find the excavation photographs and
          underlying publications, then\\nrecord the exact observation and locator for any claim
          admitted. This link\\nis a research lead, not a source record or a verification label. The
          animal\\nstrand starts from the project's public discussions of\\n[boars in Enclosure
          C](https://www.dainst.blog/the-tepe-telegrams/2016/07/15/boars-in-gobekli-tepes-enclosure\
          -c-just-a-story-of-hunters-and-prey/)\\nand [Enclosure
          B](https://www.dainst.blog/the-tepe-telegrams/2017/02/03/enclosure-b-a-short-overview/).\
          \\nThe latter explicitly leaves the reptile/felid identification open. No\\ncross-cultural
          animal pairing is admitted here on the basis of an image alone.\\n\\nThis began as a
          **question-seeded pilot** and now has a small, incomplete\\nledger. Its scope was informed
          by earlier work, so it is not a blind\\nrediscovery test. Use the same case-improvement
          process as a mature case:\\npreserve the motivation, investigate omissions and stronger
          explanations,\\ncheck findings, and produce a substantially better account when
          warranted.\\nA justified correction, useful reconsideration or well-supported decision
          to\\nretain an existing account counts as progress.\\n\\n## Reader experience\\n\\nOpen
          the eventual essay with one compelling, authenticated comparison. Show\\nthe full objects,
          the detail being compared, and dates with their uncertainty.\\nLet readers inspect the
          source and the strongest competing explanation from\\nthe comparison itself. Introduce the
          larger memory hypothesis through what\\nthose objects can actually establish. Further
          motifs earn space as they\\nchange the explanation; the complete investigation stays
          available beneath it.\\n\"},{\"id\":\"MEM-IN002\",\"title\":\"Birdmen — complete founding
          page and five investigation
          summaries\",\"role\":\"founding_research\",\"file\":\"inputs/birdmen-page.html\",\"origin\
          \":\"Exact docs/index.html bytes from the founder's public ejhong/birdmen project, commit
          e9666a7315e1af8d8e00d84e83dc7c2573d9bde3, captured locally 2026-09-07 by GPT-6 (OpenAI
          Codex), run codex-research-update-2026-09-07. Public base URL
          https://ejhong.github.io/birdmen/ resolves relative links. SHA-256
          67c4d533091b6126d5a3f8d3fcbdac5d0c2d3359dd3511ba4d1af5fa8f95403b. Includes the complete
          HTML narrative, study summaries, captions, alt text, qualifications and links. Linked
          pages, datasets and image pixels are not embedded. The page's prior AI research is
          unverified working material.\",\"license\":\"Founder authorized using his public Birdmen
          page as the case's founding research input in this Codex conversation on 2026-09-07. This
          text snapshot retains existing attributions and links; it grants no new rights in linked
          third-party works. No image files or private materials are copied.\",\"text\":\"<!doctype
          html>\\n<html lang=\\\"en\\\">\\n<head>\\n<meta charset=\\\"utf-8\\\">\\n<meta
          name=\\\"viewport\\\" content=\\\"width=device-width, initial-scale=1\\\">\\n<title>Deep
          Memory · Pictures, stories & open questions</title>\\n<meta name=\\\"description\\\"
          content=\\\"Bird-men, handbags, sacred centres and the civilisers. Five investigations
          into striking ancient similarities, with the evidence, findings and limitations of each
          kept in view.\\\">\\n<link rel=\\\"preconnect\\\"
          href=\\\"https://fonts.googleapis.com\\\">\\n<link rel=\\\"preconnect\\\"
          href=\\\"https://fonts.gstatic.com\\\" crossorigin>\\n<link
          href=\\\"https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0\
          ,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;\
          500&display=swap\\\" rel=\\\"stylesheet\\\">\\n<link rel=\\\"stylesheet\\\"
          href=\\\"style.css\\\">\\n<link rel=\\\"stylesheet\\\"
          href=\\\"collection.css\\\">\\n<script src=\\\"home.js\\\"
          defer></script>\\n</head>\\n<body>\\n<a class=\\\"skip-link\\\" href=\\\"#main\\\">Skip to
          content</a>\\n<header class=\\\"masthead\\\"><div class=\\\"wrap\\\">\\n  <div
          class=\\\"eyebrow\\\">Deep Memory · pictures, stories &amp; open questions</div>\\n  <h1
          style=\\\"margin-top:14px\\\">Bird-men, handbags and the navel of the world</h1>\\n  <p
          class=\\\"deck collection-deck\\\">Distant places. Familiar forms. How much of the
          resemblance belongs to a shared past—and how much to the ways people make images, tell
          stories and look for connections?</p>\\n  <div class=\\\"reading-links\\\"><a
          href=\\\"#investigations\\\">Explore the investigations ↓</a><a
          href=\\\"#narrative\\\">Jump to the illustrated narrative ↓</a></div>\\n  <div
          class=\\\"meta\\\"><span><b>Updated</b> September 2026</span><span><a
          href=\\\"https://github.com/ejhong/birdmen\\\">Code, sources &amp;
          data</a></span></div>\\n</div></header>\\n<nav class=\\\"toc\\\" aria-label=\\\"On this
          page\\\"><div class=\\\"wrap\\\"><ol>\\n  <li><a
          href=\\\"#investigations\\\">Studies</a></li><li><a
          href=\\\"#narrative\\\">Narrative</a></li><li><a
          href=\\\"#birdmen\\\">Bird-men</a></li><li><a
          href=\\\"#handbags\\\">Handbags</a></li><li><a href=\\\"#animals\\\">Pigs &amp;
          lizards</a></li><li><a href=\\\"#navel\\\">The navel</a></li><li><a
          href=\\\"#hands\\\">Hands</a></li><li><a href=\\\"#serpents\\\">Serpents</a></li><li><a
          href=\\\"#civilisers\\\">Civilisers</a></li><li><a
          href=\\\"#flood\\\">Floods</a></li><li><a href=\\\"#camps\\\">Explanations</a></li><li><a
          href=\\\"#sources\\\">Sources</a></li>\\n</ol></div></nav>\\n<main
          id=\\\"main\\\">\\n<section class=\\\"part\\\" id=\\\"investigations\\\"><div
          class=\\\"wrap\\\">\\n  <div class=\\\"part-head\\\"><div
          class=\\\"n\\\">Studies</div><h2>Five investigations</h2></div>\\n  <div
          class=\\\"prose\\\"><p>Each investigation keeps its question, finding and limitations
          together. The numbers identify the studies; they do not rank their importance. Earlier
          versions remain part of the record.</p></div>\\n  <!-- investigations:start -->\\n<div
          class=\\\"collection-grid\\\">\\n<article class=\\\"investigation\\\"
          aria-labelledby=\\\"study-scripts\\\">\\n  <div class=\\\"eyebrow\\\">01 · Companion
          project</div>\\n  <h3 id=\\\"study-scripts\\\"><a
          href=\\\"https://ejhong.github.io/rongo/\\\">Indus &amp; rongorongo</a></h3>\\n  <p
          class=\\\"question\\\">When do similar signs become evidence of a
          connection?</p>\\n  <dl><dt>Finding / scope</dt><dd>A comparison of sign inventories and
          the illustrations used to connect two undeciphered writing systems. Results and controls
          live in the companion project.</dd><dt>Limitations</dt><dd>A visual resemblance does not
          establish shared sound, meaning or descent. Inventory definitions and the fidelity of the
          illustrations matter.</dd></dl>\\n  <div class=\\\"versions\\\"><a
          href=\\\"https://ejhong.github.io/rongo/\\\">Read the companion investigation
          ↗</a></div>\\n</article>\\n<article class=\\\"investigation\\\"
          aria-labelledby=\\\"study-myths\\\">\\n  <div class=\\\"eyebrow\\\">02 · Catalogue
          experiment</div>\\n  <h3 id=\\\"study-myths\\\"><a href=\\\"myths.html\\\">Birds, serpents
          &amp; sacred centres</a></h3>\\n  <p class=\\\"question\\\">Do the familiar motifs travel
          together?</p>\\n  <dl><dt>Finding / scope</dt><dd>In the sampled catalogue, the three
          broad motif classes are widespread. Their bundle does not stand out against the
          study&#x27;s documentation-preserving comparisons.</dd><dt>Limitations</dt><dd>Broad
          narrative categories are not the specific images or place names in the claim. The 2016
          catalogue has uneven coverage, particularly for the ancient Near East and Rapa
          Nui.</dd></dl>\\n  <div class=\\\"versions\\\"><a href=\\\"myths.html\\\">Results &amp;
          method</a></div>\\n</article>\\n<article class=\\\"investigation\\\"
          aria-labelledby=\\\"study-pictures\\\">\\n  <div class=\\\"eyebrow\\\">03 · Three image
          pilots</div>\\n  <h3 id=\\\"study-pictures\\\"><a href=\\\"pictures.html\\\">The pillar
          &amp; the moai</a></h3>\\n  <p class=\\\"question\\\">Can AI measure the resemblance
          people see?</p>\\n  <dl><dt>Finding / scope</dt><dd>The pilots exposed altered
          illustrations, unreliable feature coding and strong disagreement between judges. Matching
          the kinds of objects changed the lineup result.</dd><dt>Limitations</dt><dd>These models
          have not been shown to reproduce human judgments of resemblance. Cropping, the photograph,
          repeated objects and incomplete runs constrain the conclusions.</dd></dl>\\n  <div
          class=\\\"versions\\\"><a href=\\\"pictures.html\\\">Pilots A–C &amp;
          qualifications</a></div>\\n</article>\\n<article class=\\\"investigation\\\"
          aria-labelledby=\\\"study-civilisers\\\">\\n  <div class=\\\"eyebrow\\\">04 · V1
          experiment · V2 source audit</div>\\n  <h3 id=\\\"study-civilisers\\\"><a
          href=\\\"civilisers.html\\\">The civilisers</a></h3>\\n  <p class=\\\"question\\\">Where
          does the resemblance between teaching figures come from?</p>\\n  <dl><dt>Finding /
          scope</dt><dd>V1&#x27;s claimed partners ranked first in 62.5% of completed lineups,
          versus 9% for random pairs. The new V2 audit inspects 29 source passages; it has not rerun
          the similarity test.</dd><dt>Limitations</dt><dd>The lineups were recognisable and used
          compressed modern accounts. The new audit is small, purposively selected and unblinded;
          neither establishes a worldwide rarity rate or a shared origin.</dd></dl>\\n  <div
          class=\\\"versions\\\"><a href=\\\"heroes.html\\\">V1 · Original lineups</a> <a
          href=\\\"civilisers.html\\\">V2 · New source-audit pilot</a></div>\\n</article>\\n<article
          class=\\\"investigation\\\" aria-labelledby=\\\"study-floods\\\">\\n  <div
          class=\\\"eyebrow\\\">05 · Text-coding pilot</div>\\n  <h3 id=\\\"study-floods\\\"><a
          href=\\\"floods.html\\\">The raven &amp; the dove</a></h3>\\n  <p
          class=\\\"question\\\">What is shared, and what is regional, in flood
          stories?</p>\\n  <dl><dt>Finding / scope</dt><dd>The coded summaries show regional
          clustering and an uneven distribution of details associated with Genesis, alongside
          widespread generic flood motifs.</dd><dt>Limitations</dt><dd>Regional structure is
          compatible with ancient inheritance. Recording after contact does not establish borrowing.
          One AI coded a compiler&#x27;s summaries, not a representative collection of original
          accounts.</dd></dl>\\n  <div class=\\\"versions\\\"><a href=\\\"floods.html\\\">Results,
          stories &amp; limitations</a></div>\\n</article>\\n</div>\\n<!-- investigations:end
          -->\\n</div></section>\\n<div id=\\\"narrative\\\">\\n<section class=\\\"part\\\"
          id=\\\"pattern\\\"><div class=\\\"wrap\\\">\\n  <div class=\\\"eyebrow
          narrative-label\\\">The illustrated narrative</div>\\n  <div class=\\\"part-head\\\"><div
          class=\\\"n\\\">01</div><h2>The pattern people see</h2></div>\\n  <div
          class=\\\"prose\\\">\\n    <p class=\\\"lede\\\">Put the images side by side and it is
          easy to see why people stop and look. A bird-headed figure, a handled shape, hands resting
          across a stone body: distant objects can share a surprisingly familiar visual
          grammar.</p>\\n    <p>A resemblance is a starting observation. Its historical meaning
          depends on the objects' dates, contexts, differences and possible connections. The
          investigations on this site explore pieces of that question with different methods. None
          is a verdict on the whole of ancient history. <a href=\\\"#investigations\\\">Read the
          experiments and their limitations</a>.</p>\\n  </div>\\n  <div class=\\\"gal
          big\\\">\\n    <figure><div class=\\\"ph\\\"><img src=\\\"img/motifs/apkallu.jpg\\\"
          alt=\\\"Eagle-headed apkallu with bucket and cone, Nimrud\\\"
          loading=\\\"lazy\\\"></div><figcaption><b>Eagle-headed genie with bucket and cone</b><span
          class=\\\"when\\\">Nimrud, Assyria, 883–859 BCE.</span> Palace of Ashurnasirpal II.
          British Museum.</figcaption></figure>\\n    <figure><div class=\\\"ph\\\"><img
          src=\\\"img/motifs/laventa19.jpg\\\" alt=\\\"La Venta Monument 19, feathered serpent and
          seated figure with bag\\\" loading=\\\"lazy\\\"></div><figcaption><b>Feathered serpent and
          a man with a bag</b><span class=\\\"when\\\">La Venta, Mexico, c. 900 BCE.</span> Olmec
          Monument 19, the earliest known feathered
          serpent.</figcaption></figure>\\n    <figure><div class=\\\"ph\\\"><img
          src=\\\"img/motifs/pillar43.jpg\\\" alt=\\\"Göbekli Tepe Pillar 43, the Vulture Stone\\\"
          loading=\\\"lazy\\\"></div><figcaption><b>Three handled shapes, a vulture, a disc, a
          scorpion</b><span class=\\\"when\\\">Göbekli Tepe, Turkey, c. 9500 BCE.</span> Pillar 43,
          Enclosure D. The headless man is below the frame.</figcaption></figure>\\n    <figure><div
          class=\\\"ph\\\"><img src=\\\"img/motifs/hoa_back.jpg\\\" alt=\\\"Back of Hoa Hakananai'a
          with birdman carvings\\\" loading=\\\"lazy\\\"></div><figcaption><b>Two birdmen, a ring
          and a girdle</b><span class=\\\"when\\\">Rapa Nui, statue c. 1000–1200 CE, carvings
          later.</span> Hoa Hakananai'a, British
          Museum.</figcaption></figure>\\n  </div>\\n</div></section>\\n\\n<section
          class=\\\"part\\\" id=\\\"birdmen\\\"><div class=\\\"wrap\\\">\\n  <div
          class=\\\"part-head\\\"><div class=\\\"n\\\">02</div><h2>Bird-men</h2></div>\\n  <div
          class=\\\"prose\\\">\\n    <p>The examples below range from a bird-headed figure in the
          Lascaux shaft scene to Egyptian gods, Assyrian genii, costumed figures in the Americas and
          the birdman imagery of Rapa Nui. They invite comparison, but “bird-man” is a broad
          description: a deity with a bird's head, a person wearing feathers and a person
          transforming into a bird need not be the same idea.</p>\\n    <p>The <a
          href=\\\"myths.html\\\">catalogue experiment</a> finds its broad bird-person class in 55%
          of the 926 sampled traditions. That helps establish a baseline for that category; it does
          not tell us how often a particular pose, object and arrangement occur together. The <a
          href=\\\"pictures.html\\\">image pilots</a> tried to get closer to composition, while
          exposing how differently AI judges can see the same material.</p>\\n  </div>\\n  <h3
          id=\\\"bird-detail\\\">The bird, the bent limb and the circle</h3>\\n  <div class=\\\"gal
          paired\\\">\\n    <figure><div class=\\\"ph\\\"><a
          href=\\\"img/inputs/bird-figure.jpeg\\\"><img src=\\\"img/inputs/bird-figure.jpeg\\\"
          alt=\\\"Bird-headed figure with a bent limb near a small rounded object, outlined by dark
          markings\\\" loading=\\\"lazy\\\"></a></div><figcaption><b>A bird-headed figure with a
          rounded object</b>Supplied reference. Object provenance and the nature of the dark surface
          markings still need checking.</figcaption></figure>\\n    <figure><div class=\\\"ph\\\"><a
          href=\\\"img/inputs/pillar43-bird-detail.jpeg\\\"><img
          src=\\\"img/inputs/pillar43-bird-detail.jpeg\\\" alt=\\\"Close view of the bird on Pillar
          43, its extended wing and the disc above it\\\"
          loading=\\\"lazy\\\"></a></div><figcaption><b>The bird and disc on Pillar 43</b>Supplied
          crop. The disc's position is visible; calling it an egg, sun or held object adds an
          interpretation.</figcaption></figure>\\n  </div>\\n  <div
          class=\\\"comparison-note\\\"><p>The interesting comparison is relational: a profile head,
          a bent or extended limb, and a rounded form nearby. That is more specific than simply
          finding a bird in both pictures. The shapes, contact points and surrounding scene should
          be checked against complete, securely identified objects.</p></div>\\n  <h3>Bird-men
          across the gallery</h3>\\n  <div class=\\\"gal\\\">\\n    <figure><div
          class=\\\"ph\\\"><img src=\\\"img/motifs/lascaux.jpg\\\" alt=\\\"Lascaux shaft scene\\\"
          loading=\\\"lazy\\\"></div><figcaption><b>The shaft scene</b><span
          class=\\\"when\\\">Lascaux, France, c. 17,000 BP.</span> Bird-headed man, bison, bird on a
          staff.</figcaption></figure>\\n    <figure><div class=\\\"ph\\\"><img
          src=\\\"img/motifs/nevali.jpg\\\" alt=\\\"Nevalı Çori totem sculpture with bird\\\"
          loading=\\\"lazy\\\"></div><figcaption><b>Totem with bird on a human head</b><span
          class=\\\"when\\\">Nevalı Çori, Turkey, c. 8500 BCE.</span> Şanlıurfa Museum, with
          reconstruction drawing.</figcaption></figure>\\n    <figure><div class=\\\"ph\\\"><img
          src=\\\"img/motifs/horus.jpg\\\" alt=\\\"Horus at Edfu\\\"
          loading=\\\"lazy\\\"></div><figcaption><b>Horus</b><span class=\\\"when\\\">Edfu, Egypt,
          237–57 BCE.</span> Falcon god of kingship; the temple is Ptolemaic, the god is
          Predynastic.</figcaption></figure>\\n    <figure><div class=\\\"ph\\\"><img
          src=\\\"img/motifs/ba_bird.jpg\\\" alt=\\\"Egyptian ba bird amulet\\\"
          loading=\\\"lazy\\\"></div><figcaption><b>The <em>ba</em>, soul as human-headed
          bird</b><span class=\\\"when\\\">Egypt, New Kingdom or later.</span> Wooden amulet, Museo
          Egizio, Turin.</figcaption></figure>\\n    <figure><div class=\\\"ph\\\"><img
          src=\\\"img/motifs/garuda.jpg\\\" alt=\\\"Garuda statue, Kathmandu\\\"
          loading=\\\"lazy\\\"></div><figcaption><b>Garuda</b><span class=\\\"when\\\">Kathmandu
          Durbar Square, Nepal.</span> The eagle-man mount of Vishnu, a South and South-East Asian
          constant.</figcaption></figure>\\n    <figure><div class=\\\"ph\\\"><img
          src=\\\"img/motifs/cacaxtla.jpg\\\" alt=\\\"Cacaxtla Bird Man mural\\\"
          loading=\\\"lazy\\\"></div><figcaption><b>The Bird Man</b><span
          class=\\\"when\\\">Cacaxtla, Mexico, c. 650–900 CE.</span> Lord in bird costume on a
          feathered serpent, holding a ceremonial bar.</figcaption></figure>\\n    <figure><div
          class=\\\"ph\\\"><img src=\\\"img/motifs/cahokia.jpg\\\" alt=\\\"Cahokia Birdman
          tablet\\\" loading=\\\"lazy\\\"></div><figcaption><b>The Birdman tablet</b><span
          class=\\\"when\\\">Cahokia, Illinois, c. 1200 CE.</span> Falcon-costumed man; snakeskin
          pattern on the reverse.</figcaption></figure>\\n    <figure><div class=\\\"ph\\\"><img
          src=\\\"img/motifs/rogan.jpg\\\" alt=\\\"Rogan plate birdman, Etowah\\\"
          loading=\\\"lazy\\\"></div><figcaption><b>Rogan plate</b><span class=\\\"when\\\">Etowah,
          Georgia, c. 1250–1375 CE.</span> Copper repoussé falcon dancer with mace and trophy
          head.</figcaption></figure>\\n    <figure><div class=\\\"ph\\\"><img
          src=\\\"img/motifs/orongo.jpg\\\" alt=\\\"Birdman petroglyphs at Mata Ngarau, Orongo\\\"
          loading=\\\"lazy\\\"></div><figcaption><b>Three birdmen, Mata Ngarau</b><span
          class=\\\"when\\\">Orongo, Rapa Nui, c. 1680–1866.</span> Historical photograph of the
          relief carvings at the ceremonial village.</figcaption></figure>\\n    <figure><div
          class=\\\"ph\\\"><img src=\\\"img/motifs/hoa_back.jpg\\\" alt=\\\"Back of Hoa
          Hakananai'a\\\" loading=\\\"lazy\\\"></div><figcaption><b>Hoa Hakananai'a, the
          back</b><span class=\\\"when\\\">Orongo, Rapa Nui.</span> Two facing birdmen, a sooty tern
          between their beaks, komari, paddles, the ring and
          girdle.</figcaption></figure>\\n  </div>\\n</div></section>\\n\\n<section
          class=\\\"part\\\" id=\\\"handbags\\\"><div class=\\\"wrap\\\">\\n  <div
          class=\\\"part-head\\\"><div class=\\\"n\\\">03</div><h2>The handbags</h2></div>\\n  <div
          class=\\\"prose\\\">\\n    <p>The comparison joins the three arched forms on Pillar 43, a
          bucket carried by Assyrian genii, handled chlorite objects from the Halil Rud region and
          the small object held by the figure on La Venta Monument 19. The recurring outline is
          worth looking at closely.</p>\\n    <p>Shape and function are separate questions. Assyrian
          ritual context supports a bucket-and-purifier interpretation; the function of the Göbekli
          forms remains uncertain. A handle is also a practical solution that can recur
          independently. A useful investigation would compare handle attachment, proportions,
          decoration and accompanying figures, while retaining uncertainty about what each object
          was for. See the excavation team's <a
          href=\\\"https://www.dainst.blog/the-tepe-telegrams/2016/10/14/of-animals-and-a-headless-\
          man-gobekli-tepe-pillar-43/\\\">Pillar 43 discussion</a> and the <a
          href=\\\"https://ijas.usb.ac.ir/article_1442.html\\\">Halil Rud wear
          study</a>.</p>\\n  </div>\\n  <div class=\\\"gal\\\">\\n    <figure><div
          class=\\\"ph\\\"><img src=\\\"img/motifs/pillar43.jpg\\\" alt=\\\"Pillar 43 top
          register\\\" loading=\\\"lazy\\\"></div><figcaption><b>Pillar 43, the top
          register</b><span class=\\\"when\\\">Göbekli Tepe, c. 9500 BCE.</span> Three arched
          objects with small animals; function unknown.</figcaption></figure>\\n    <figure><div
          class=\\\"ph\\\"><img src=\\\"img/motifs/apkallu.jpg\\\" alt=\\\"Apkallu with banduddu
          bucket\\\" loading=\\\"lazy\\\"></div><figcaption><b>The <em>banduddû</em></b><span
          class=\\\"when\\\">Nimrud, 883–859 BCE.</span> A bucket, named in ritual texts, with the
          cone used to sprinkle from it.</figcaption></figure>\\n    <figure><div
          class=\\\"ph\\\"><img src=\\\"img/motifs/jiroft.jpg\\\" alt=\\\"Jiroft chlorite
          handbag-shaped object\\\" loading=\\\"lazy\\\"></div><figcaption><b>Chlorite
          \\\"handbag\\\"</b><span class=\\\"when\\\">Jiroft, Iran, c. 2500 BCE.</span> Hero between
          serpents; National Museum of Iran. Worn on the handle as if hung on a
          cord.</figcaption></figure>\\n    <figure><div class=\\\"ph\\\"><img
          src=\\\"img/motifs/laventa19b.jpg\\\" alt=\\\"La Venta Monument 19 drawing\\\"
          loading=\\\"lazy\\\"></div><figcaption><b>Monument 19</b><span class=\\\"when\\\">La
          Venta, c. 900 BCE.</span> The seated figure's pouch, usually read as an incense
          bag.</figcaption></figure>\\n  </div>\\n</div></section>\\n\\n<section class=\\\"part\\\"
          id=\\\"animals\\\"><div class=\\\"wrap\\\">\\n  <div class=\\\"part-head\\\"><div
          class=\\\"n\\\">04</div><h2>Pigs, lizards &amp; other stone animals</h2></div>\\n  <div
          class=\\\"prose\\\"><p>The animal comparisons extend beyond bird-headed figures. Rounded
          bodies, projecting snouts and splayed limbs can make distant carvings feel familiar. These
          reference photographs are observations to investigate, not results from the earlier image
          corpus. Open a photograph to inspect the supplied original.</p></div>\\n  <h3
          id=\\\"pigs\\\">Pigs, boars and a compact stone silhouette</h3>\\n  <div class=\\\"gal
          paired\\\">\\n    <figure><div class=\\\"ph\\\"><a
          href=\\\"img/inputs/boar-museum.jpeg\\\"><img src=\\\"img/inputs/boar-museum.jpeg\\\"
          alt=\\\"Boar-like stone sculpture in a museum case, with a raised back and projecting
          snout\\\" loading=\\\"lazy\\\"></a></div><figcaption><b>A boar-like museum
          sculpture</b>Supplied photograph. The visible form can be compared now; the museum and
          object number still need verification.</figcaption></figure>\\n    <figure><div
          class=\\\"ph\\\"><a href=\\\"img/inputs/lingjiatan-pig.jpeg\\\"><img
          src=\\\"img/inputs/lingjiatan-pig.jpeg\\\" alt=\\\"Pig-form carving with a Chinese caption
          identifying Lingjiatan tomb 07M23\\\" loading=\\\"lazy\\\"></a></div><figcaption><b>The
          Lingjiatan comparison</b>The supplied Chinese caption identifies tomb 07M23 and a weight
          of 88 kg. Those details are caption-derived, not independently verified
          here.</figcaption></figure>\\n  </div>\\n  <div class=\\\"comparison-note\\\"><p>The low,
          rounded body, raised back, lowered head and projecting snout make an immediately legible
          visual rhyme. The mouth treatment and outline differ, and the photographs do not establish
          equal scale. Both anatomy and carving choices could contribute: the next useful comparison
          is with other securely identified pig and boar sculptures.</p></div>\\n  <h3
          id=\\\"lizards\\\">Reptile-like forms—and the animal in its setting</h3>\\n  <div
          class=\\\"gal paired context\\\">\\n    <figure><div class=\\\"ph\\\"><a
          href=\\\"img/inputs/animal-montage.jpeg\\\"><img
          src=\\\"img/inputs/animal-montage.jpeg\\\" alt=\\\"Montage of crouched, snarling and
          downward-facing animal sculptures and reliefs labelled Göbekli Tepe\\\"
          loading=\\\"lazy\\\"></a></div><figcaption><b>Crouched bodies, open jaws, emphatic
          limbs</b>The supplied montage brings several objects together. Its images need individual
          identifications before they become a comparison
          dataset.</figcaption></figure>\\n    <figure><div class=\\\"ph\\\"><a
          href=\\\"img/inputs/animal-in-context.jpeg\\\"><img
          src=\\\"img/inputs/animal-in-context.jpeg\\\" alt=\\\"Crouched stone animal in an
          excavated structure with a perforated slab behind it\\\"
          loading=\\\"lazy\\\"></a></div><figcaption><b>The setting matters too</b>The arrangement
          is consistent with the Göbekli Tepe Enclosure C entrance discussed by the excavators; the
          precise photograph credit remains unverified.</figcaption></figure>\\n  </div>\\n  <div
          class=\\\"comparison-note\\\"><p>The splayed limbs, low bodies and pronounced jaws are
          worth following as a family of forms. “Lizard” should remain a proposed identification
          where the animal is uncertain. The excavation team's <a
          href=\\\"https://www.dainst.blog/the-tepe-telegrams/2016/07/15/boars-in-gobekli-tepes-enc\
          losure-c-just-a-story-of-hunters-and-prey/\\\">discussion of Enclosure C</a> distinguishes
          boars from snarling predators and considers their arrangement together. That context may
          be as informative as an isolated silhouette.</p></div>\\n</div></section>\\n\\n<section
          class=\\\"part\\\" id=\\\"navel\\\"><div class=\\\"wrap\\\">\\n  <div
          class=\\\"part-head\\\"><div class=\\\"n\\\">05</div><h2>The navel of the
          world</h2></div>\\n  <div class=\\\"prose\\\">\\n    <p>A sacred centre described as a
          navel is an evocative parallel. It is also a linguistic claim that needs its own source
          history. The Greek <em>omphalos</em>, the gloss of Cusco in Garcilaso's account, Rapanui
          <em>Te Pito o te Henua</em> and the modern Turkish name Göbekli Tepe are not
          interchangeable kinds of evidence.</p>\\n    <p>For each, the questions are: what does the
          expression mean in its language, when is that meaning first recorded, and was it a name
          the ancient builders used? The <a href=\\\"myths.html#scope\\\">myth experiment's scope
          note</a> matters here: a catalogue category for a world axis does not directly test a
          place-name etymology. Shared bodily metaphors are possible; a particular inherited usage
          would need more specific evidence.</p>\\n  </div>\\n  <div
          class=\\\"gal\\\">\\n    <figure><div class=\\\"ph\\\"><img
          src=\\\"img/motifs/omphalos.jpg\\\" alt=\\\"Omphalos of Delphi\\\"
          loading=\\\"lazy\\\"></div><figcaption><b>The omphalos</b><span class=\\\"when\\\">Delphi,
          Greece; Hellenistic or Roman copy.</span> Archaeological Museum of Delphi. Netted stone
          marking the meeting point of Zeus's eagles.</figcaption></figure>\\n    <figure><div
          class=\\\"ph\\\"><img src=\\\"img/motifs/tepitokura2.jpg\\\" alt=\\\"Te Pito Kura
          stone\\\" loading=\\\"lazy\\\"></div><figcaption><b>Te Pito Kura, \\\"navel of
          light\\\"</b><span class=\\\"when\\\">Rapa Nui.</span> The iron-rich sphere near Ahu Te
          Pito Kura, with the fallen giant Paro nearby.</figcaption></figure>\\n    <figure><div
          class=\\\"ph\\\"><img src=\\\"img/motifs/gobekli_d.jpg\\\" alt=\\\"Göbekli Tepe Enclosure
          D pillar\\\" loading=\\\"lazy\\\"></div><figcaption><b>\\\"Navel hill\\\"</b><span
          class=\\\"when\\\">Göbekli Tepe, Enclosure D.</span> The Turkish name describes the
          mound's shape; the Kurdish names mean \\\"wish
          hill.\\\"</figcaption></figure>\\n  </div>\\n</div></section>\\n\\n<section
          class=\\\"part\\\" id=\\\"hands\\\"><div class=\\\"wrap\\\">\\n  <div
          class=\\\"part-head\\\"><div class=\\\"n\\\">06</div><h2>Hands on the
          belly</h2></div>\\n  <div class=\\\"prose\\\">\\n    <p>The hands and arms are part of
          what makes these monuments feel related. Compare where the hands meet, the direction and
          length of the fingers, the belt, and whether the figure holds anything. A hand across the
          abdomen and a hand at the groin are close in outline but different
          observations.</p>\\n    <p>Carving limbs against a stone body can protect them from
          breakage, making material constraints a plausible contributor to the pose. That does not
          settle its symbolic meaning. The useful comparison includes both the particular gesture
          and other figures made in the same medium, rather than assuming either common descent or
          coincidence from posture alone.</p>\\n  </div>\\n  <div
          class=\\\"gal\\\">\\n    <figure><div class=\\\"ph\\\"><img
          src=\\\"img/motifs/gobekli_pillar.jpg\\\" alt=\\\"Göbekli Tepe T-pillar with fox
          relief\\\" loading=\\\"lazy\\\"></div><figcaption><b>T-pillar with fox</b><span
          class=\\\"when\\\">Göbekli Tepe, c. 9500 BCE.</span> The T is a stylised head; the shaft a
          body. Arms and hands are carved on the central pillars of Enclosure
          D.</figcaption></figure>\\n    <figure><div class=\\\"ph\\\"><img
          src=\\\"img/motifs/urfa_man.jpg\\\" alt=\\\"Urfa Man statue\\\"
          loading=\\\"lazy\\\"></div><figcaption><b>Urfa Man</b><span class=\\\"when\\\">Şanlıurfa,
          c. 9000 BCE.</span> An early life-size human statue, hands over the
          genitals.</figcaption></figure>\\n    <figure><div class=\\\"ph\\\"><img
          src=\\\"img/motifs/karahan_man.jpg\\\" alt=\\\"Karahan Tepe statue\\\"
          loading=\\\"lazy\\\"></div><figcaption><b>Karahan Tepe figure</b><span
          class=\\\"when\\\">c. 9000 BCE.</span> Sister site of Göbekli Tepe; both hands on the
          phallus.</figcaption></figure>\\n    <figure><div class=\\\"ph\\\"><img
          src=\\\"img/motifs/tongariki.jpg\\\" alt=\\\"Moai at Ahu Tongariki\\\"
          loading=\\\"lazy\\\"></div><figcaption><b>Moai</b><span class=\\\"when\\\">Ahu Tongariki,
          Rapa Nui, c. 1250–1500 CE.</span> Hands meet on the abdomen above the belt; the Polynesian
          tiki convention.</figcaption></figure>\\n    <figure><div class=\\\"ph\\\"><img
          src=\\\"img/motifs/ponce.jpg\\\" alt=\\\"Ponce monolith, Tiwanaku\\\"
          loading=\\\"lazy\\\"></div><figcaption><b>Ponce monolith</b><span
          class=\\\"when\\\">Tiwanaku, Bolivia, c. 500–900 CE.</span> Hands to the chest holding a
          beaker and a snuff
          tablet.</figcaption></figure>\\n  </div>\\n</div></section>\\n\\n<section
          class=\\\"part\\\" id=\\\"serpents\\\"><div class=\\\"wrap\\\">\\n  <div
          class=\\\"part-head\\\"><div class=\\\"n\\\">07</div><h2>Serpents, and the feathered
          serpent</h2></div>\\n  <div class=\\\"prose\\\">\\n    <p>Serpents appear alongside other
          figures on the objects below; the feathered serpent of Mesoamerica is a more specific
          combination than the broad category “snake.” A comparison should preserve that
          distinction, including feathers, head shape, body arrangement and the relationship to a
          human figure.</p>\\n    <p>The <a href=\\\"myths.html#r3\\\">catalogue analysis</a>
          reports a broad cosmic-serpent class in 37% of its sampled traditions. Its geographical
          result describes that selected category and dataset. It cannot, by itself, distinguish
          independent invention from very old transmission or establish the ancestry of an
          individual carving.</p>\\n  </div>\\n  <div class=\\\"gal\\\">\\n    <figure><div
          class=\\\"ph\\\"><img src=\\\"img/motifs/teotihuacan.jpg\\\" alt=\\\"Feathered Serpent
          head, Teotihuacan\\\" loading=\\\"lazy\\\"></div><figcaption><b>Feathered Serpent</b><span
          class=\\\"when\\\">Teotihuacan, Mexico, c. 150–250 CE.</span> Temple of the Feathered
          Serpent.</figcaption></figure>\\n    <figure><div class=\\\"ph\\\"><img
          src=\\\"img/motifs/quetz_codex.jpg\\\" alt=\\\"Quetzalcoatl in the Codex Borbonicus\\\"
          loading=\\\"lazy\\\"></div><figcaption><b>Quetzalcoatl and Ehecatl</b><span
          class=\\\"when\\\">Codex, 16th century.</span> The feathered serpent and the wind god as
          one deity.</figcaption></figure>\\n    <figure><div class=\\\"ph\\\"><img
          src=\\\"img/motifs/jiroft.jpg\\\" alt=\\\"Jiroft hero with serpents\\\"
          loading=\\\"lazy\\\"></div><figcaption><b>Hero between serpents</b><span
          class=\\\"when\\\">Jiroft, c. 2500 BCE.</span> The master-of-animals scheme on a chlorite
          \\\"handbag.\\\"</figcaption></figure>\\n  </div>\\n</div></section>\\n\\n<section
          class=\\\"part\\\" id=\\\"civilisers\\\"><div class=\\\"wrap\\\">\\n  <div
          class=\\\"part-head\\\"><div class=\\\"n\\\">08</div><h2>The people who brought the
          arts</h2></div>\\n  <div class=\\\"prose\\\">\\n    <p>The narrative parallel is just as
          arresting as the visual one: a figure brings knowledge, changes human life and departs.
          Oannes, Viracocha, Quetzalcoatl and Bochica recur in these comparisons. But the exact
          arrival, teaching and departure need to be read in each account, rather than supplied by a
          composite biography.</p>\\n    <p>The <a href=\\\"heroes.html\\\">original AI lineups</a>
          did find a similarity signal under their conditions, with serious limits. The <a
          href=\\\"civilisers.html\\\">source-level follow-up</a> opens the passages themselves: sea
          arrival and sea departure, particular crafts, catastrophe sequence and return promises. It
          keeps earlier accounts and later retellings separate. A colonial recording date is a
          reason to examine mediation, not proof that every detail was invented by a
          chronicler.</p>\\n  </div>\\n  <div class=\\\"gal\\\">\\n    <figure><div
          class=\\\"ph\\\"><img src=\\\"img/motifs/fish_apkallu.jpg\\\" alt=\\\"Ea with fish-cloaked
          apkallu\\\" loading=\\\"lazy\\\"></div><figcaption><b>Ea and a fish-cloaked sage</b><span
          class=\\\"when\\\">Assyria, 1st millennium BCE.</span> The <em>apkallu</em> type that the
          texts actually name; Oannes in Berossus.</figcaption></figure>\\n    <figure><div
          class=\\\"ph\\\"><img src=\\\"img/motifs/gate_sun.jpg\\\" alt=\\\"Gate of the Sun,
          Tiwanaku\\\" loading=\\\"lazy\\\"></div><figcaption><b>Gate of the Sun</b><span
          class=\\\"when\\\">Tiwanaku, Bolivia, c. 500–900 CE.</span> The central staff-bearer,
          often called Viracocha; the identification is
          modern.</figcaption></figure>\\n    <figure><div class=\\\"ph\\\"><img
          src=\\\"img/motifs/moche_beards.jpg\\\" alt=\\\"Moche vessels of bearded men\\\"
          loading=\\\"lazy\\\"></div><figcaption><b>Bearded men, Moche</b><span
          class=\\\"when\\\">Peru, c. 100–700 CE.</span> Facial hair on pre-Columbian objects should
          be distinguished from the source history of a particular civiliser
          story.</figcaption></figure>\\n    <figure><div class=\\\"ph\\\"><img
          src=\\\"img/motifs/bochica.jpg\\\" alt=\\\"Bochica\\\"
          loading=\\\"lazy\\\"></div><figcaption><b>Bochica</b><span class=\\\"when\\\">Modern
          statue, Cuítiva, Colombia.</span> The Muisca civiliser as reimagined in the 20th
          century.</figcaption></figure>\\n  </div>\\n</div></section>\\n\\n<section
          class=\\\"part\\\" id=\\\"flood\\\"><div class=\\\"wrap\\\">\\n  <div
          class=\\\"part-head\\\"><div class=\\\"n\\\">09</div><h2>What survives the
          water?</h2></div>\\n  <div class=\\\"prose\\\"><p>Flood stories raise several different
          questions: whether people remember local disasters, whether particular stories travelled,
          and whether traditions preserve much older environmental knowledge. None requires every
          version to retain the same details or to lose its regional character.</p><p>The <a
          href=\\\"floods.html\\\">flood experiment</a> maps details in 263 summaries. Its regional
          patterns are useful observations. Establishing the age of a memory, or showing that a
          particular detail was borrowed from Genesis, needs additional source and historical
          evidence. Its limitations now make that distinction
          explicit.</p></div>\\n</div></section>\\n\\n<section class=\\\"part\\\"
          id=\\\"camps\\\"><div class=\\\"wrap\\\">\\n  <div class=\\\"part-head\\\"><div
          class=\\\"n\\\">10</div><h2>Several histories could produce a
          resemblance</h2></div>\\n  <div class=\\\"two-col\\\">\\n    <div
          class=\\\"camp\\\"><h3>Transmission and inheritance</h3><p>People carry images, stories
          and skills. A connection becomes more informative when there are dated intermediates, a
          plausible route, or distinctive details that occur together and predict further evidence.
          Regional change is compatible with a much older shared inheritance.</p><p>A
          lost-civilisation account adds stronger claims about the source, its date and its
          capabilities. Similarity alone cannot establish those additions.</p></div>\\n    <div
          class=\\\"camp\\\"><h3>Convergence and retelling</h3><p>Similar materials, animals, bodies
          and problems can produce similar forms. Stories can also become more alike through
          translation, borrowing and comparative writing. These possibilities need evidence too;
          calling something an archetype is not a complete explanation.</p><p>The best next question
          is often small: which detail is shared, how early is it attested, and what else would we
          expect to find if the connection were
          real?</p></div>\\n  </div>\\n</div></section>\\n\\n<section class=\\\"part\\\"
          id=\\\"approach\\\"><div class=\\\"wrap\\\">\\n  <div class=\\\"part-head\\\"><div
          class=\\\"n\\\">11</div><h2>Keep the wonder. Open the evidence.</h2></div>\\n  <div
          class=\\\"prose\\\"><p>A common source, long-distance contact, independent invention and
          later retelling are different explanations. More than one can be true in different cases.
          The work here is to make the relevant evidence easier to see and the uncertainties harder
          to miss.</p></div>\\n  <div class=\\\"principles\\\">\\n    <div><h3>Look at the thing
          itself</h3><p>A complete object, an identifiable passage, an honest caption. Keep the
          original beside its interpretation.</p></div>\\n    <div><h3>Ask a question that can
          change</h3><p>Include plausible alternatives and the strongest differences. An unexpected
          match or an unresolved source is worth reporting.</p></div>\\n    <div><h3>Keep the whole
          record</h3><p>Publish methods, results, qualifications and earlier versions. A useful
          experiment can also be a limited one.</p></div>\\n  </div>\\n  <p class=\\\"small\\\"><a
          href=\\\"https://github.com/ejhong/birdmen/issues\\\">Corrections and better sources are
          welcome</a>. AI assists the research; its output is not a substitute for the
          evidence.</p>\\n</div></section>\\n\\n<section class=\\\"part\\\" id=\\\"sources\\\"><div
          class=\\\"wrap\\\">\\n  <div class=\\\"part-head\\\"><div
          class=\\\"n\\\">12</div><h2>Sources</h2></div>\\n  <div
          class=\\\"two-col\\\">\\n    <div>\\n      <h3>Objects and sites</h3>\\n      <ul
          class=\\\"sources\\\">\\n        <li>Pitts, M., Miles, J., Pagi, H. &amp; Earl, G. (2014).
