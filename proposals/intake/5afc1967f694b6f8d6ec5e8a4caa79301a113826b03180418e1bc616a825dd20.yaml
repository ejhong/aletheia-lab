          06\",\"change\":\"Opened an unassessed research question.\",\"reason\":\"A topic seed
          establishes scope; claims and evidence must be recorded before
          assessment.\",\"actor\":\"Aletheia topic
          scaffold\",\"aiAssisted\":true,\"kind\":\"content\"},{\"date\":\"2026-09-06\",\"change\":\
          \"Opened the illustrated case and adopted the first source-reading proposal as an
