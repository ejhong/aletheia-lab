<figcaption>Four records from Greenland ice on one clock. Four eruptions, two of them very large, come in the 150 years before the cold begins, the last about twenty years before. The cold then sets in more slowly than at most other sudden coolings. The platinum arrives about 26 years in, and the ammonium climbs after that. Nothing in the ice marks a single instant when everything changed. Eruptions and platinum are placed by tie points between ice cores, good to about ten years. Hover or focus for the numbers.</figcaption>
</figure>
