<figure class="fig" aria-label="Precision funnel across all 32 claimed YDB sites">
<div class="fig-scroll">
<svg class="chart" viewBox="0 0 720 215" role="img" aria-label="Funnel from 32 claimed YDB sites down to 4 sites with direct tight dating" xmlns="http://www.w3.org/2000/svg">
<text x="268" y="37" text-anchor="end" fill="var(--ink)" font-family="var(--sans)" font-size="12">Claimed YDB sites (Kennett 2015 Fig. 2)</text>
<rect x="278" y="22" width="390.0" height="22" rx="2" fill="var(--paper-deep)"/>
<rect x="278" y="22" width="390.0" height="22" rx="2" fill="var(--slate)" opacity="0.82"/>
<text x="676.0" y="37" fill="var(--ink)" font-family="var(--mono)" font-size="11.5" font-weight="600">32/32 (100.0%)</text>
<text x="268" y="73" text-anchor="end" fill="var(--ink)" font-family="var(--sans)" font-size="12">Sufficient data for Bayesian age model</text>
<rect x="278" y="58" width="390.0" height="22" rx="2" fill="var(--paper-deep)"/>
<rect x="278" y="58" width="280.3" height="22" rx="2" fill="var(--ochre)" opacity="0.82"/>
<text x="566.3" y="73" fill="var(--ink)" font-family="var(--mono)" font-size="11.5" font-weight="600">23/32 (71.9%)</text>
<text x="268" y="109" text-anchor="end" fill="var(--ink)" font-family="var(--sans)" font-size="12">Direct date from proxy layer itself</text>
<rect x="278" y="94" width="390.0" height="22" rx="2" fill="var(--paper-deep)"/>
<rect x="278" y="94" width="121.9" height="22" rx="2" fill="var(--copper)" opacity="0.82"/>
<text x="407.9" y="109" fill="var(--ink)" font-family="var(--mono)" font-size="11.5" font-weight="600">10/32 (31.2%)</text>
<text x="268" y="145" text-anchor="end" fill="var(--ink)" font-family="var(--sans)" font-size="12">Direct date + 95% CI ≤ 500 yr wide</text>
<rect x="278" y="130" width="390.0" height="22" rx="2" fill="var(--paper-deep)"/>
<rect x="278" y="130" width="60.9" height="22" rx="2" fill="var(--copper)" opacity="0.82"/>
<text x="346.9" y="145" fill="var(--ink)" font-family="var(--mono)" font-size="11.5" font-weight="600">5/32 (15.6%)</text>
<text x="268" y="181" text-anchor="end" fill="var(--ink)" font-family="var(--sans)" font-size="12">Direct date + 95% CI ≤ 300 yr wide</text>

<rect x="278" y="166" width="48.8" height="22" rx="2" fill="var(--verdigris)" opacity="0.82"/>
<text x="334.8" y="181" fill="var(--ink)" font-family="var(--mono)" font-size="11.5" font-weight="600">4/32 (12.5%)</text>
</svg>
</div>
<figcaption>Chronological precision funnel across all 32 claimed YDB sites in Kennett et al. (2015, Fig. 2). Nine sites cannot be modeled at all; 13 modeled sites rely on indirect or interpolated age models rather than dates on the proxy layer itself; only 4 of 32 sites (12.5% — Abu Hureyra, Arlington Canyon, Aalsterhut, and Bull Creek) combine a direct date on the proxy layer with a modeled 95% credible interval ≤ 300 yr wide.</figcaption>
</figure>
