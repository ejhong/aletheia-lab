<figcaption>Baseline-centered trajectories from 300 years before to 300 years after each abrupt cooling onset. In both Greenland temperature (A) and dust (B), the Younger Dryas (copper) ramps into cold much more slowly during the shaded first 60 years than typical ice-age coolings before joining the middle of the grey band. In Antarctica (C), temperatures nudge upward rather than plunging into a global impact winter. Hover or focus any bin for exact numbers.</figcaption>
