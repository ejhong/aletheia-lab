<figcaption>When the cold begins, the real record does not fall below the made-up ones in any region. But look at the shapes: the same spike after the onset and the same hollow after it, on three continents at once, down to the small wiggles. People did not move in step like that. The radiocarbon calibration curve goes from steep to flat in those years and bends counts of dates in just this way, and the made-up records carry too little of the effect. Hover or focus for the numbers.</figcaption>
