<figcaption><strong>Paper B (Shocked Quartz, <code>e0319840</code>) audit of PLOS One&rsquo;s two retraction criteria.</strong> (A) Only 13 of 66 stratigraphic levels (19.7%) across the three sites were analyzed for shocked quartz; Arlington Canyon&rsquo;s YDB sample (<code>ARL-1B</code>, 501 cm) is the bottom row of Table S5 with zero underlying strata checked, and Blackwater Draw checked only one slide above and one below. (B) The paper&rsquo;s headline &chi;&sup2; = 0.057 (p = 0.97) used Arlington Canyon&rsquo;s 482.5 cm date (18.5 cm above the shocked quartz); swapping in the actual 500.5 cm date raises &chi;&sup2; 66-fold (4.21), and including all 25 published direct dates rejects single-year synchrony decisively (T = 90.94, p &lt; 10<sup>&minus;9</sup>). Crucially, PLOS One&rsquo;s notice raised no challenge to the quartz microscopy images themselves.</figcaption>
</figure>
