<figcaption><strong>The shocked quartz paper: the journal&rsquo;s two reasons.</strong> (A) Of 66 samples listed at the three sites, 13 were examined for shocked quartz: three in the layer and ten above or below. At Arlington Canyon nothing lies below, since the section ends on gravel, and the three samples above are inside the layer as the authors define it. (B) The paper&rsquo;s own test of agreement used three modelled ages, two with errors of 235 and 365 years, and could hardly have failed. The twelve radiocarbon dates from the lower part of the Arlington Canyon section are not one age; without the five the original authors set aside as old wood, the disagreement is modest. The other two sites have no dates on the sampled layer itself. Whether the grains are shocked quartz was not tested by the journal or here.</figcaption>
