<figcaption>Old DNA is in short pieces; a modern person's is mostly in long ones. If the lean were in her own genome, her short and long fragments would show it alike. It is weak in the short fragments and strong in the long ones. Four others from the same cemetery, measured the same way, show nothing either way. Bars are one standard error. Hover or focus a row for the numbers.</figcaption>
