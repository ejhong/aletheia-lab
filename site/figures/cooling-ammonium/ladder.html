<figcaption>Each row is one abrupt cooling of the last ice age, ordered by the average of the two cores. To the right of &ldquo;no change&rdquo;, ammonium ran higher in the delayed century than before the cooling. Most rows are to the right; the Younger Dryas is at the top, with two others close behind. Hover or focus a row for the numbers.</figcaption>
