<figcaption>Top: the 8 strongest 300-year windows in Taylor Glacier's combined CO₂-rise × δ¹³C-drop score (TG_BURN). The Younger Dryas onset window (copper, rank 7 of 54) trails Heinrich Stadials 1 and 4 and the mid-Younger Dryas window 150–450 years later (rank 2). Bottom (exploratory): raw Taylor Glacier δ¹³C-CO₂ samples showing a flat plateau across 12,937–12,751 cal BP before dropping to −6.780‰ at 12,580 cal BP—matching the size and timing of Southern Ocean carbon release during Heinrich Stadial 1.</figcaption>
