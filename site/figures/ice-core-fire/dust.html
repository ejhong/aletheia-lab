<figcaption>Exploratory. Dust rises as the climate turns cold, dry and windy, climbing for about a century after the abrupt shift and then staying high. Ammonium climbs alongside it during the shaded century, then drops back by roughly half while dust remains high. That decoupling is why thinner snow and drier winds alone cannot explain the peak; the other two cores show the same.</figcaption>
