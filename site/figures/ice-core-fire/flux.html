<figcaption>Exploratory. Because annual ice layers thin after the onset (from 4.01 to 3.01 cm/yr in NGRIP, and 2.75 cm/yr at the 3-year peak), the same fallout produces a higher concentration. Scaling each late-glacial window's excess by its local layer thickness drops the Younger Dryas window from 2nd to 5th of 16. Hover or focus a bar for values.</figcaption>
