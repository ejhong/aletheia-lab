<figcaption>Single-core stratigraphy in GISP2, needing no timescale comparison. At 1712.2–1712.3 m—the depth supporters are reported to cite for platinum and fire (unverified)—ammonium is a modest 31.4 ppb, bordered by 9–15 ppb samples. The century-long ammonium high sits 2 to 3.5 metres higher in the core, peaking at 77.3 ppb at 1708.8–1708.9 m.</figcaption>
