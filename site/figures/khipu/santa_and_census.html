<figure class="fig" aria-label="Santa Valley 1670 revisita calibration and archival Rosetta-readiness census">
<div class="fig-controls" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center">
  <span style="font-size:12px;color:var(--muted);margin-right:4px">View:</span>
  <button type="button" class="kh-s-btn is-on" data-k="santa" style="font-size:12px;padding:4px 9px;border:1px solid var(--rule);border-radius:4px;background:var(--copper);color:#fff;cursor:pointer">Santa Valley 1670 Moiety Null Calibration</button>
  <button type="button" class="kh-s-btn" data-k="census" style="font-size:12px;padding:4px 9px;border:1px solid var(--rule);border-radius:4px;background:transparent;color:var(--ink);cursor:pointer">Archival Rosetta-Readiness Census (619 Khipus)</button>
</div>
<div class="fig-scroll">
<svg id="kh-s-svg" class="chart" viewBox="0 0 720 330" role="img" aria-label="Santa Valley null probabilities and OKR provenance census" xmlns="http://www.w3.org/2000/svg"></svg>
</div>
<figcaption><strong>Left tab: combinatorial caution on the 1670 Santa Valley moiety match.</strong> Because six <em>pachacas</em> can be split 3-vs-3 in 10 ways, 72.0% of random 6-pachaca compositions summing to 130 (52.8% even under overdispersed Dirichlet(0.5)) match the Santa khipus&rsquo; (70, 63) verso/recto count as closely as Medrano &amp; Urton (2018), and 62.3% (44.4% overdispersed) match as closely as FitzPatrick (2024). By contrast, matching both group count and tribute total jointly in a random 6-khipu bundle is rare (0/10,000), though raw OKR first-cord sums (756 across 134 chunks) remain well above 367 pesos. <strong>Right tab:</strong> out of 619 OKR khipus, 221 lack provenance and 157 provenanced specimens carry &ge;10 knotted cords plus repeated banding ready for colonial-census matching once Peruvian <em>revisitas</em> are digitized.</figcaption>
<script>
(function(){
  var D = {"santa": [{"lbl": "Uniform Dirichlet(1.0) \u2014 Match \u2264 Medrano & Urton (L1 \u2264 5)", "pct": 72.0, "col": "var(--copper)"}, {"lbl": "Uniform Dirichlet(1.0) \u2014 Match \u2264 FitzPatrick (L1 \u2264 3)", "pct": 62.3, "col": "var(--copper)"}, {"lbl": "Overdispersed Dirichlet(0.5) \u2014 Match \u2264 Medrano & Urton (L1 \u2264 5)", "pct": 52.8, "col": "var(--teal)"}, {"lbl": "Overdispersed Dirichlet(0.5) \u2014 Match \u2264 FitzPatrick (L1 \u2264 3)", "pct": 44.4, "col": "var(--teal)"}, {"lbl": "Random 6-khipu bundle matching (132 \u00b1 5% groups & 367 \u00b1 30% sum)", "pct": 0.0, "col": "#475569"}], "census": [{"provenance": "Unknown / Blank", "n_khipus": 221, "n_ge10_knotted": 151, "n_repeated_banding": 79, "n_mixed_RV": 25, "n_rosetta_ready": 0, "median_pendant_sum": 295, "max_pendant_sum": 1078956}, {"provenance": "Other Named Provenances", "n_khipus": 136, "n_ge10_knotted": 105, "n_repeated_banding": 53, "n_mixed_RV": 19, "n_rosetta_ready": 50, "median_pendant_sum": 829, "max_pendant_sum": 716160}, {"provenance": "Pachacamac", "n_khipus": 90, "n_ge10_knotted": 71, "n_repeated_banding": 37, "n_mixed_RV": 3, "n_rosetta_ready": 35, "median_pendant_sum": 1233, "max_pendant_sum": 205515}, {"provenance": "Incahuasi", "n_khipus": 52, "n_ge10_knotted": 38, "n_repeated_banding": 23, "n_mixed_RV": 4, "n_rosetta_ready": 23, "median_pendant_sum": 1091, "max_pendant_sum": 556242}, {"provenance": "Ica", "n_khipus": 49, "n_ge10_knotted": 37, "n_repeated_banding": 18, "n_mixed_RV": 4, "n_rosetta_ready": 18, "median_pendant_sum": 705, "max_pendant_sum": 362158}, {"provenance": "Leymebamba", "n_khipus": 22, "n_ge10_knotted": 20, "n_repeated_banding": 9, "n_mixed_RV": 19, "n_rosetta_ready": 9, "median_pendant_sum": 1752, "max_pendant_sum": 235373}, {"provenance": "Puruchuco (Archive 301)", "n_khipus": 18, "n_ge10_knotted": 11, "n_repeated_banding": 10, "n_mixed_RV": 0, "n_rosetta_ready": 7, "median_pendant_sum": 202, "max_pendant_sum": 3475}, {"provenance": "Nazca", "n_khipus": 13, "n_ge10_knotted": 10, "n_repeated_banding": 9, "n_mixed_RV": 1, "n_rosetta_ready": 9, "median_pendant_sum": 1112, "max_pendant_sum": 86434}, {"provenance": "Armatambo, Huaca San Pedro", "n_khipus": 11, "n_ge10_knotted": 7, "n_repeated_banding": 4, "n_mixed_RV": 2, "n_rosetta_ready": 4, "median_pendant_sum": 144, "max_pendant_sum": 30346}, {"provenance": "Santa", "n_khipus": 6, "n_ge10_knotted": 6, "n_repeated_banding": 2, "n_mixed_RV": 1, "n_rosetta_ready": 2, "median_pendant_sum": 1566, "max_pendant_sum": 14953}]};
  var svg = document.getElementById("kh-s-svg");
  var btns = document.querySelectorAll(".kh-s-btn");
  function el(tag, attrs, txt){
    var n = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (txt !== undefined) n.textContent = txt;
    return n;
  }
  function draw(k){
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    if (k === "santa") {
      var L = 345, R = 675, T = 38, B = 278;
      function sx(v){ return L + (v / 85) * (R - L); }
      svg.appendChild(el("text", {x: 16, y: 20, "font-size": 12, "font-weight": 600, fill: "var(--ink)"}, "Null probability (%) of matching Santa Valley 1670 benchmarks by chance (20,000 MC draws)"));
      svg.appendChild(el("line", {x1: L, x2: R, y1: B, y2: B, stroke: "var(--rule)"}));
      svg.appendChild(el("line", {x1: L, x2: L, y1: T, y2: B, stroke: "var(--rule)"}));
      [0, 20, 40, 60, 80].forEach(function(v){
        var x = sx(v);
        svg.appendChild(el("line", {x1: x, x2: x, y1: T, y2: B, stroke: "var(--rule)", "stroke-dasharray": "2,3", opacity: 0.45}));
        svg.appendChild(el("text", {x: x, y: B + 16, "text-anchor": "middle", "font-size": 10, fill: "var(--muted)"}, v + "%"));
      });
      var step = (B - T) / D.santa.length;
      D.santa.forEach(function(b, i){
        var y = T + i * step + 10, bh = step - 20;
        svg.appendChild(el("text", {x: L - 10, y: y + bh * 0.65, "text-anchor": "end", "font-size": 10.2, fill: "var(--ink)"}, b.lbl));
        var w = Math.max(2, sx(b.pct) - L);
        svg.appendChild(el("rect", {x: L, y: y, width: w, height: bh, rx: 2.5, fill: b.col, opacity: 0.88}));
        svg.appendChild(el("text", {x: L + w + 6, y: y + bh * 0.65, "font-size": 10.5, "font-weight": 700, fill: b.col}, b.pct.toFixed(b.pct < 1 ? 2 : 1) + "%"));
      });
      svg.appendChild(el("text", {x: (L + R) / 2, y: 316, "text-anchor": "middle", "font-size": 10.2, fill: "var(--muted)"}, "Choosing the best of 10 three-vs-three partitions makes a near-70/63 moiety split common by chance alone"));
    } else {
      var L = 195, R = 675, T = 40, B = 285;
      var xmax = 240;
      function sx(v){ return L + (v / xmax) * (R - L); }
      svg.appendChild(el("text", {x: 16, y: 20, "font-size": 12, "font-weight": 600, fill: "var(--ink)"}, "OKR Khipu Archives (619 total): Total vs. ≥10 knotted vs. Rosetta-ready banded"));
      svg.appendChild(el("rect", {x: 420, y: 10, width: 10, height: 10, fill: "#cbd5e1"}));
      svg.appendChild(el("text", {x: 434, y: 19, "font-size": 9.5, fill: "var(--ink)"}, "Total"));
      svg.appendChild(el("rect", {x: 472, y: 10, width: 10, height: 10, fill: "var(--teal)"}));
      svg.appendChild(el("text", {x: 486, y: 19, "font-size": 9.5, fill: "var(--ink)"}, "≥10 knotted"));
      svg.appendChild(el("rect", {x: 558, y: 10, width: 10, height: 10, fill: "var(--copper)"}));
      svg.appendChild(el("text", {x: 572, y: 19, "font-size": 9.5, fill: "var(--ink)"}, "Rosetta-ready"));

      svg.appendChild(el("line", {x1: L, x2: R, y1: B, y2: B, stroke: "var(--rule)"}));
      svg.appendChild(el("line", {x1: L, x2: L, y1: T, y2: B, stroke: "var(--rule)"}));
      [0, 50, 100, 150, 200].forEach(function(v){
        var x = sx(v);
        svg.appendChild(el("text", {x: x, y: B + 15, "text-anchor": "middle", "font-size": 9.5, fill: "var(--muted)"}, String(v)));
      });
      var step = (B - T) / D.census.length;
      D.census.forEach(function(r, i){
        var y = T + i * step + 4, h = step - 8;
        svg.appendChild(el("text", {x: L - 8, y: y + h * 0.72, "text-anchor": "end", "font-size": 10, fill: "var(--ink)"}, r.provenance));
        svg.appendChild(el("rect", {x: L, y: y, width: Math.max(2, sx(r.n_khipus) - L), height: h, rx: 2, fill: "#cbd5e1"}));
        svg.appendChild(el("rect", {x: L, y: y, width: Math.max(1, sx(r.n_ge10_knotted) - L), height: h, rx: 2, fill: "var(--teal)", opacity: 0.72}));
        if (r.n_rosetta_ready > 0) {
          svg.appendChild(el("rect", {x: L, y: y, width: Math.max(2, sx(r.n_rosetta_ready) - L), height: h, rx: 2, fill: "var(--copper)", opacity: 0.92}));
        }
        svg.appendChild(el("text", {x: sx(r.n_khipus) + 5, y: y + h * 0.72, "font-size": 9.3, fill: "var(--muted)"}, r.n_khipus + " (" + r.n_rosetta_ready + " ready)"));
      });
      svg.appendChild(el("text", {x: (L + R) / 2, y: 318, "text-anchor": "middle", "font-size": 10.2, fill: "var(--muted)"}, "Top digitization targets for colonial revisitas: Pachacamac (35), Incahuasi (23), Ica (18), Leymebamba (9), Nazca (9)"));
    }
  }
  btns.forEach(function(b){
    b.addEventListener("click", function(){
      btns.forEach(function(x){ x.classList.remove("is-on"); x.style.background = "transparent"; x.style.color = "var(--ink)"; });
      b.classList.add("is-on"); b.style.background = "var(--copper)"; b.style.color = "#fff";
      draw(b.getAttribute("data-k"));
    });
  });
  draw("santa");
})();
</script>
</figure>
