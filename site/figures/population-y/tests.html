<figcaption>Each dot is one test; the bar is its 95% interval. A dot to the right of zero means the Amazonians share more alleles with that group than the comparison group does. Z is the estimate divided by its uncertainty; geneticists usually ask for 3 or more. The first eight tests compare with the Mixe unless marked. The hollow dot is a control that should sit near zero if the excess were specific to Australasians.</figcaption>
