<div class="pair" role="list" aria-label="Two readings of being a machine">
<div class="pair-card" role="listitem">
<p class="pair-formula">∃e K ( I am machine e )</p>
<p class="pair-says">There is a machine such that <b>I know</b> I am that machine.</p>
<div class="pair-out"><p class="verdict-status is-no"><span class="dot"></span>Refuted</p>The logic proves this false, whatever the machines are.</div>
</div>
<div class="pair-card" role="listitem">
<p class="pair-formula">∃e ( I am machine e )</p>
<p class="pair-says">There is a machine such that I am that machine.</p>
<div class="pair-out"><p class="verdict-status is-open"><span class="dot"></span>Not refuted</p>It has a price instead: then there are truths I can never know.</div>
</div>
