<figure class="fig" aria-label="Which assumptions each result needs">
<div class="fig-scroll">
<table class="matrix">
<thead>
<tr>
<th scope="col">Result about a knower</th>
<th scope="col">Proofs are known</th>
<th scope="col">Knowledge follows through</th>
<th scope="col">What is known is so</th>
<th scope="col">…and that is known</th>
<th scope="col">Known to be known</th>
<th scope="col" class="m-machine">The system is a machine</th>
</tr>
</thead>
<tbody>
<tr>
<td>It outruns any system it knows to be sound<span class="m-sub">Reinhardt's Theorem 1</span></td>
<td class="m-yes" aria-label="needed">●</td><td class="m-yes" aria-label="needed">●</td><td class="m-no" aria-label="not needed">·</td><td class="m-no" aria-label="not needed">·</td><td class="m-no" aria-label="not needed">·</td><td class="m-no m-machine" aria-label="not needed">·</td>
</tr>
<tr>
<td>It knows something that system does not prove</td>
<td class="m-yes" aria-label="needed">●</td><td class="m-yes" aria-label="needed">●</td><td class="m-yes" aria-label="needed">●</td><td class="m-no" aria-label="not needed">·</td><td class="m-no" aria-label="not needed">·</td><td class="m-no m-machine" aria-label="not needed">·</td>
</tr>
<tr>
<td>It cannot know consistent a system that captures all it knows<span class="m-sub">Reinhardt's Theorem 6</span></td>
<td class="m-yes" aria-label="needed">●</td><td class="m-yes" aria-label="needed">●</td><td class="m-no" aria-label="not needed">·</td><td class="m-yes" aria-label="needed">●</td><td class="m-yes" aria-label="needed">●</td><td class="m-no m-machine" aria-label="not needed">·</td>
</tr>
<tr>
<td>It cannot know which system it is<span class="m-sub">after Reinhardt's Theorem 5</span></td>

</tr>

<figcaption>A dot means the proof uses that assumption. The last column is empty: no result uses the system being a machine. The assumption that carries "cannot know which system it is" is the fourth, knowing that your own knowledge is true. Facts taken from arithmetic, such as the system having a Gödel sentence, are assumed as well and are not shown.</figcaption>
