<figure class="fig" aria-label="How far the argument reaches">
<div class="fig-scroll">
<svg class="chart" viewBox="0 0 720 168" role="img" aria-label="A line from Gödel's theorem to the claim that the mind is not a machine. The proof reaches the midpoint, not a machine you can know to be sound, and stops there." xmlns="http://www.w3.org/2000/svg">
<line class="c-path" x1="30" x2="360" y1="84" y2="84"/>
<line class="c-path-open" x1="372" x2="678" y1="84" y2="84"/>
<circle class="c-station" cx="30" cy="84" r="5"/>
<circle class="c-reached" cx="360" cy="84" r="9"/>
<circle class="c-target" cx="690" cy="84" r="8"/>
<text class="c-label-lg" x="30" y="50">Gödel's theorem</text>
<text class="c-label-lg" x="360" y="50" text-anchor="middle">Not a machine you can know to be sound</text>
<text class="c-label-lg" x="690" y="50" text-anchor="end">Not a machine at all</text>
<text class="c-sub" x="30" y="24">start</text>
<text class="c-yes" x="360" y="24" text-anchor="middle">Proved</text>
<text class="c-no" x="690" y="24" text-anchor="end">Not established</text>
<text class="c-sub" x="195" y="116" text-anchor="middle">The first argument gets this far</text>
<text class="c-sub" x="195" y="134" text-anchor="middle">and no further.</text>
<text class="c-sub" x="525" y="116" text-anchor="middle">The second argument tries to cross here.</text>
<text class="c-sub" x="525" y="134" text-anchor="middle">Its rules contradict themselves.</text>
</svg>
</div>
<figcaption>What the proofs establish, and where they stop. The midpoint is Penrose's own conclusion of 1994. The gap is the difference between being a reliable machine and being able to know that you are one.</figcaption>
</figure>
