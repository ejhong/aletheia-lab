<figure class="fig" aria-label="Three ways to run the second argument, and where each ends">
<div class="routes" role="list">
<div class="route" role="listitem">
<div class="route-how"><p class="verdict-kicker">Route one</p><p class="route-name">Use the two rules as they stand.</p></div>
<div class="route-arrow" aria-hidden="true"></div>
<div class="route-end"><p class="verdict-status is-no"><span class="dot"></span>Contradiction</p><p class="stance-note">The rules clash once a sentence can speak of its own truth. From them anything follows, so nothing is shown.</p></div>
</div>
<div class="route" role="listitem">
<div class="route-how"><p class="verdict-kicker">Route two</p><p class="route-name">Make the rules safe. Let "I am F" cover everything I know.</p></div>
<div class="route-arrow" aria-hidden="true"></div>
<div class="route-end"><p class="verdict-status is-open"><span class="dot"></span>Cannot be asserted</p><p class="stance-note">"I am F" is then neither true nor false, and the safe rules do not apply to it. Koellner's theorem, quoted here.</p></div>
</div>
<div class="route" role="listitem">
<div class="route-how"><p class="verdict-kicker">Route three</p><p class="route-name">Make the rules safe. Let "I am F" cover my arithmetic only.</p></div>
<div class="route-arrow" aria-hidden="true"></div>
<div class="route-end"><p class="verdict-status is-part"><span class="dot"></span>Stops short</p><p class="stance-note">The rules now apply, and the argument shows I know something F cannot prove. But that something is not arithmetic, so "I am F" is not contradicted.</p></div>
</div>
</div>
<figcaption>Three ways to run the second argument. None arrives at "I am not F".</figcaption>
</figure>
