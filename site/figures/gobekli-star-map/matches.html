<figcaption>No judge passed the scorpion check, so this is a description of what the three judges did, with that check switched off. It is not a scored result. For each constellation stick figure, the animal the paper matches to it and the one the judges ranked most like it. The scorpion was the paper's starting point, so the main count sets it aside and drops its photograph from every ranking, leaving 11; the other seven rows are on that count, and the judges' best is the paper's animal for 0 of them. A mean rank is the average place over every ranking by every judge: 1 means always first; chance gives 6 among 11 (6.5 among 12). The place counts ties against the paper. Pictures from Sweatman and Tsikritsis (2017), Table 1, CC BY 4.0; line drawings reduced to black lines by us.</figcaption>
