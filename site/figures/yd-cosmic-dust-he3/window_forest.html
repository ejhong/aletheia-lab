<figcaption>Summary of median extraterrestrial ³He flux ratios and 10,000-resample bootstrap 95% confidence intervals across all pre-registered panels. Both Veritas 8.2 Ma breakup positive controls jump cleanly above 2.2× (green, p ≤ 0.0005), whereas every single Younger Dryas and deglacial window in both the Pacific (²³⁰Th-normalized) and Atlantic (bulk burial) sits at or below 1.0× — ruling out any sustained >1.22× Younger Dryas surge and any >0.97× late-deglacial surge at 95% confidence.</figcaption>
