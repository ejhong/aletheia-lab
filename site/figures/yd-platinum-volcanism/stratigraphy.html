<figcaption>Every curve comes from the exact same GISP2 ice core, plotted by depth (older on the left, younger on the right). Two giant volcanic sulfate spikes (13,029 and 12,917 b2k) precede the official GS-1 cooling onset (12,896 b2k, black line). Petaev et al.'s platinum spike (copper band, 1712.375–1712.000 m) arrives 18–32 years after GS-1 onset with no major GISP2 sulfate peak of its own, yet still sits 1.5–2.5 m deeper (older) than GISP2's steepest step into full stadial cold and dust (dashed line). Hover or focus points for details.</figcaption>
