<figcaption>Chronological alignment on GICC05. Four bipolar eruptions strike between 13,028 and 12,917 b2k (culminating in a 201 Tg Northern Hemisphere high-latitude eruption 21 years before GS-1 onset). Cooling begins at 12,896 b2k; the GISP2 platinum spike follows 26–32 years later (12,870–12,858 b2k); and GISP2's steepest cold and dust steps arrive another 40–70 years later.</figcaption>
