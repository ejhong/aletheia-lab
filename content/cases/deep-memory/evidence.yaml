- id: MEM-E008
  title: A reported bundle null depends on definitions and documentation controls
  claimIds:
    - MEM-C008
  sourceId: SRC-MEM-BIRDMEN-MYTHS
  direction: supports
  strength: moderate
  sourceStatement: The page reports that an excess over simple independence
    disappears under comparisons preserving documentation. It describes
    keyword-defined classes, a fixed-margin matrix randomization, random motif
    bundles and documentation-matched culture sets. It explicitly excludes the
    specific visual motifs and navel place-name etymologies from what this test
    establishes and notes thin coverage of several relevant traditions.
  editorInference: "This supports the claim about the experiment's reported
    outcome, not verification of its calculations. If reproduced, the result
    would weaken the claim that these broad categories form an unusually
    co-occurring package in this sample. It would not exclude inheritance of
    more specific motifs or sequences. The page's stronger inference from
    dispersed cosmic-serpent motifs to independent invention is not established
    by dispersion alone: an old transmitted tradition could also become
    geographically widespread."
  exactLocator: html-text-v1, characters 185–273 (retrieved text; not a printed-page locator)
  limitations:
    - Matrix, class membership, exclusions and outputs were not checked in this
