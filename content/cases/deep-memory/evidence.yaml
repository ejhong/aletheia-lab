- id: MEM-E010
  title: An alleged asymmetry in explaining missing parts of the narrative package
  claimIds:
    - MEM-C010
  sourceId: SRC-MEM-THOMPSON-2013
  direction: supports
  strength: moderate
  sourceStatement: Thompson says that Dene and Inuit/Yupiq traditions lack several
    elements he understands Witzel's Laurasian storyline to require. He argues
    that missing elements are explained as unrecorded, forgotten or untold for
    these traditions, while comparable incompleteness is used to classify San
    traditions as Gondwana.
  editorInference: This directly supports the attribution of the criticism. If
    verified against explicit, consistently applied classification rules and
    adequately documented narratives, such asymmetry would threaten the model's
    discriminatory value. The substantive inheritance reply—that traditions can
    lose elements and records can be incomplete—remains possible, but requires
    independently justified and symmetrical criteria rather than case-by-case
    rescue. Witzel's actual reply has not been read here.
  exactLocator: html-text-v1, characters 7355–7407 (retrieved text; not a
    printed-page locator)
