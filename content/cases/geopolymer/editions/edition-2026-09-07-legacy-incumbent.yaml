article: >
  At the granite quarries of Aswan, beside the largest abandoned obelisk in
  Egypt, there is a block that tourists are invited to hit. The idea is
  charming: pick up one of the rounded dolerite stones that ancient workers
  supposedly used, strike the granite, and feel the past in your hands. Guides
  have been running this accidental experiment for decades. According to the
  proponent literature, [no visitor has ever managed to reproduce one of the
  smooth, scooped depressions that cover the quarry walls]{claim=GEO-C002}. The
  stones bounce. The granite shrugs.


  {plate:IMG-GEO-P01}


  Anecdotes like this prove nothing by themselves, and this one has never been
  systematically surveyed. But it points at the right question, which is not
  *who built the monuments* — nobody serious disputes that ancient Egyptians
  built the pyramids and ancient Andeans built Tiwanaku — but *how the hardest
  stone was worked*. The megalithic casting hypothesis gives a heterodox answer:
  some of it wasn't worked at all. It was made — mixed, molded, and set in
  place, the way we make concrete — from crushed rock, mineral binders, and
  chemistry that a Bronze Age society could plausibly command.


  {plate:IMG-GEO-P02}


  This idea has a serious pedigree and a disreputable neighborhood. It was first
  proposed in scientific form by the French materials chemist Joseph Davidovits
  in 1979, has attracted a small body of peer-reviewed work, and is currently
  the subject of funded laboratory research. It also circulates in a media
  ecosystem of lost civilizations and ancient high technology that this case has
  nothing to do with. The casting hypothesis requires no aliens, no Atlantis,
  and no forgotten machines — only forgotten chemistry, which is a documented
  historical phenomenon. That is precisely what makes it testable, and what
  makes the testing so far — real, contested, and short of decisive — so
  interesting.


  ## The conventional account, taken seriously


  Any honest map of this dispute has to start by steelmanning the orthodoxy,
  because the orthodoxy is strong.


  The carved-and-transported account is not a guess. Quarries exist, with
  unfinished monuments still attached to bedrock — the Aswan obelisk itself is
  the most famous example, abandoned mid-extraction after the granite cracked.
  Tools have been recovered in quantity. Worker settlements at Giza have been
  excavated down to their bakeries and administrative records. Experimental
  archaeologists have carved granite with dolerite and copper, slowly but
  genuinely. Ramp remains survive. And modern geochemical provenancing has
  matched monument stone to specific quarries — most famously at Stonehenge,
  where trace-element analysis matched Stone 58 directly to the West Woods area,
  with fifty of fifty-two sarsens sharing a single geochemical profile.


  The conventional account's gaps are quantitative, not existential. It does not
  need a miracle anywhere. What it needs, in a few specific places, is more
  time, more workers, or better technique than anyone has yet demonstrated.
  Those places are where this case lives.


  ## Where the anomalies actually are


  Strip away everything anecdotal and the residue is small but real.


  Start with the rates. For a century, the standard account of granite quarrying
  rested largely on Reginald Engelbach's 1922 fieldwork at Aswan — foundational
  work whose own experimental basis was, by modern standards, remarkably thin.
  In 2023 a Slovak team finally produced a modern number: [photogrammetric
  measurement of granite removal with a dolerite pounder yielded roughly 216
  cubic centimeters per hour]{claim=GEO-C001} — a rate the authors themselves
  conclude speaks against pounders as the sole quarrying method. That is a
  peer-reviewed measurement, and it is the strongest single item in the anomaly
  column. Note what it is evidence *for*, though: it stresses the orthodox
  timeline. It says nothing directly about casting. Nearby stand the quarry's
  stranger features — [vertical shafts reportedly too narrow for any worker to
  swing a pounder at their bottom]{claim=GEO-C006} — which remain unmeasured by
  anyone without a stake in the answer.


  Then the chemistry. The natron-route version of the hypothesis, developed by
  the Hungarian researcher Marcell Fóti, observes that Egypt sat on
  [industrial-scale deposits of natron — the alkaline salt that ancient
  glassmakers used as flux — whose supply is documented into late antiquity and
  then declines sharply]{claim=GEO-C011}. Natron plus heat plus silica gives
  waterglass, a mineral binder; the [required temperatures were within reach of
  charcoal-and-bellows pyrotechnology]{claim=GEO-C010}. And a millennium of
  medieval reports adds a strange detail: accounts of Caliph Al-Ma'mun's forced
  entry into the Great Pyramid in 820 AD [describe interior chamber walls coated
  with salt]{claim=GEO-C003} — an odd thing for a sealed structure of dry
  quarried limestone to do, and an expected thing for stone that set wet with
  natron in it. That report has never been traced to its primary Arabic sources.
  It might dissolve on contact with them. Nobody has looked.


  Finally, and most importantly, the stone itself. In the Andes, the laboratory
  evidence comes from Pumapunku in Bolivia, where [published SEM and
  petrographic analyses report organic matter and microstructural features that
  the authors argue natural volcanic andesite should not
  contain]{claim=GEO-C004}. Those papers passed peer review. They also come
  entirely from the Davidovits team, analyzing samples whose chain of custody is
  contested, and no independent laboratory has ever re-examined them. In Egypt,
  a 2006 study by a Drexel materials scientist reported microstructural evidence
  of reconstituted limestone in pyramid samples — a rare non-proponent data
  point. Its critical literature is now imported below: four independent
  petrographic examinations, every one concluding natural limestone, including
  the one study that analyzed a genuine geopolymer control alongside the pyramid
  stone. What keeps that exchange from being decisive is a genuinely factual
  fight over the samples themselves — Davidovits disputes that the famous "Lauer
  sample" his critics analyzed was authentic, while Egypt's antiquities
  authority disputes where the Drexel samples came from at all. Meanwhile [the
  basic feasibility claim — that convincing artificial limestone can be made at
  all with ancient inputs]{claim=GEO-C012} — is about the only rung of the
  ladder in decent shape, thanks to modern geopolymer chemistry and
  demonstration blocks.


  {plate:IMG-GEO-P04}


  ## The ladder, and why it thins as it climbs


  Notice the shape of what we just walked through. At the bottom: observations,
  some solid, most unverified. In the middle: mechanism claims — the ingredients
  existed, the temperatures were reachable, the chemistry works. At the top: the
  attribution claims that actually matter — [that some blocks of the Great
  Pyramid are cast reconstituted limestone]{claim=GEO-C020}, [that Pumapunku's
  andesite was geopolymer-cast]{claim=GEO-C021}, and the headline disjunction
  that [at least one major megalithic monument, somewhere, contains man-made
  cast stone]{claim=GEO-C022}.


  {plate:IMG-GEO-P03}


  Each rung is weaker than the one below it, and evidence for a lower rung does
  not automatically climb. Natron in Egypt is well documented and proves nothing
  about pyramids. Feasibility is real and proves nothing about history. This
  decay-with-altitude is normal for ambitious hypotheses; the argument ladder
  below this article makes it visible for this one.


  ## The crux


  Here is where the disagreement actually lives, and it is narrower than either
  camp usually admits.


  The strongest conventional evidence class is provenance matching: monument
  stone chemically fingerprinted to a quarry. The casting hypothesis's most
  consequential reply is methodological — [that standard provenance methods
  cannot, by design, tell carved quarry stone from stone cast using aggregate
  gathered at that same quarry]{claim=GEO-C030}, because crushed rock keeps its
  trace-element fingerprint. If that is right, provenance studies settle far
  less than they appear to. But the reply cuts both ways: cast stone needs a
  binder, binders have signatures — water bound in mineral phases, carbonates,
  microstructures that geology doesn't produce — and a method audit that went
  looking for those signatures and found none would falsify specific casting
  claims outright, monument by monument.


  One version of that audit now exists for the Great Pyramid: the control study
  mentioned above went looking for a binder signature in casing stones, showed
  the signature is plainly detectable in the genuine geopolymer, and found none
  in the monument stone — a negative for the original alkali recipe, though not
  for the revised calcium-silicate binder that more recent pro-casting
  laboratory work has shifted toward. What has still never been done is a
  blinded comparison of disputed monument samples against geologically matched
  natural stone with the criteria specified in advance — which is either an
  indictment of the hypothesis's proponents, or of its dismissers, or, most
  plausibly, of a funding landscape with no home for questions shaped like this.


  ## What would settle it


  This case does not end in a verdict, because on the present record no honest
  verdict is available. It ends in a research agenda: eight funded project
  designs — archival, field, and experimental — each attached to the specific
  claims it would move, several of them cheap. Trace the Al-Ma'mun account to
  its sources. Replicate the quarrying-rate measurement. Run the
  provenance-methods audit. Re-analyze the Pumapunku samples in a laboratory
  with no stake in the outcome.


  The scoop marks at Aswan have waited five thousand years for someone to
  measure them properly. The full agenda, with what each project would tell us,
  is below.
