  synthesis: The overall claim that at least one major monument contains cast
    stone remains unresolved in this targeted update. The existing Egyptian
    argument contains competing readings of monument samples and genuine
    binder-sensitive negative evidence; the proposed calcium-silicate variant
    and disputed sample histories must be examined on their own terms. The
    Pumapunku reports remain one proponent line without an independent
    examination of securely documented andesite. The new granite experiment is a
    narrow feasibility lead for assisted quarrying, not evidence that a monument
    was cast; a matched heat-only comparison is needed before attributing the
    effect specifically to carbonate chemistry. The Queen’s Chamber analysis
    identifies surface halite but does not identify the manufacture of a whole
    block, and the study did not sample the upper King’s Chamber deposits.
    Engelbach’s test-shaft interpretation improves the quarry-function
    alternatives without settling cutting technique. This pass sharpens the
    research priorities and removes overextended inferences; it does not claim a
    fresh verification of every inherited source or a changed overall verdict.
  steelman: The strongest surviving affirmative case is the combination of
    feasible artificial-stone recipes with reported binder or microstructural
    anomalies in nominated monument samples. A quarry match can identify
    ingredients without always establishing fabrication history; negative
    evidence for one binder in some samples does not exclude every recipe or
    every block. Those are substantive replies requiring recipe-specific,
    provenance-secure tests. They do not neutralize binder-sensitive
    petrography, remove the need for independent replication, or turn a
    laboratory demonstration of granite weakening into evidence of historical
    casting.
